<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Global Neighbors: a prototype connecting people who need help with neighbors, nonprofits, and NGOs, from Greater Boston to the world.">
<title>Global Neighbors</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#FAFBFC;
    --surface:#FFFFFF;
    --surface-2:#F0F4F7;
    --border:#DEE6EC;
    --text:#132A46;
    --text-muted:#5B6B82;
    --primary:#1C7293;
    --primary-strong:#0F4C5C;
    --primary-soft:#E6F0F3;
    --accent:#E2711D;
    --accent-soft:#FCEADA;
    --success:#2F8F5B;
    --success-soft:#E4F4EB;
    --warning:#B8790E;
    --warning-soft:#FBF0DC;
    --danger:#B3261E;
    --danger-soft:#FBE3E1;
    --shadow:0 1px 2px rgba(19,42,70,.06), 0 6px 18px rgba(19,42,70,.07);
    --shadow-lg:0 8px 16px rgba(19,42,70,.07), 0 20px 46px rgba(19,42,70,.1);
    --glow-accent:0 10px 26px rgba(226,113,29,.32);
    --glow-primary:0 10px 26px rgba(28,114,147,.22);
    --grad-accent:linear-gradient(135deg,#E2711D,#F0934E);
    --grad-primary:linear-gradient(135deg,#1C7293,#0F4C5C);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B1826; --surface:#122238; --surface-2:#16304A; --border:#25456A;
      --text:#EAF1F7; --text-muted:#93A9C1; --primary:#59B6D6; --primary-strong:#8BD1E8;
      --primary-soft:#173947; --accent:#F0934E; --accent-soft:#3B2413;
      --success:#59C68A; --success-soft:#12331F; --warning:#E3A83B; --warning-soft:#3A2C0E; --danger:#F2A09A; --danger-soft:#3D1715;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
      --shadow-lg:0 10px 20px rgba(0,0,0,.35), 0 26px 54px rgba(0,0,0,.4);
      --glow-accent:0 10px 28px rgba(240,147,78,.28);
      --glow-primary:0 10px 28px rgba(89,182,214,.2);
      --grad-accent:linear-gradient(135deg,#F0934E,#E2711D);
      --grad-primary:linear-gradient(135deg,#59B6D6,#1C7293);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B1826; --surface:#122238; --surface-2:#16304A; --border:#25456A;
    --text:#EAF1F7; --text-muted:#93A9C1; --primary:#59B6D6; --primary-strong:#8BD1E8;
    --primary-soft:#173947; --accent:#F0934E; --accent-soft:#3B2413;
    --success:#59C68A; --success-soft:#12331F; --warning:#E3A83B; --warning-soft:#3A2C0E; --danger:#F2A09A; --danger-soft:#3D1715;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
    --shadow-lg:0 10px 20px rgba(0,0,0,.35), 0 26px 54px rgba(0,0,0,.4);
    --glow-accent:0 10px 28px rgba(240,147,78,.28);
    --glow-primary:0 10px 28px rgba(89,182,214,.2);
    --grad-accent:linear-gradient(135deg,#F0934E,#E2711D);
    --grad-primary:linear-gradient(135deg,#59B6D6,#1C7293);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:'Newsreader',Georgia,'Times New Roman',serif; text-wrap:balance; margin:0; }
  p{ margin:0; }
  button{ font-family:inherit; }
  ::selection{ background:var(--accent-soft); color:var(--text); }
  a{ color:var(--primary); }

  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  button, .btn{ cursor:pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:2px solid var(--primary); outline-offset:2px;
  }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
    font-size:.92rem; font-weight:600; padding:.62rem 1.1rem; border-radius:9px;
    border:1px solid transparent; transition:transform .15s ease, box-shadow .2s ease, background .15s ease, border-color .15s ease;
    white-space:nowrap;
  }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--grad-accent); color:#fff; box-shadow:var(--glow-accent); }
  .btn-primary:hover{ transform:translateY(-1px); box-shadow:0 14px 30px rgba(226,113,29,.4); }
  .btn-secondary{ background:var(--primary-soft); color:var(--primary-strong); }
  .btn-secondary:hover{ border-color:var(--primary); transform:translateY(-1px); }
  .btn-ghost{ background:transparent; color:var(--text-muted); border-color:var(--border); }
  .btn-ghost:hover{ color:var(--text); border-color:var(--primary); }
  .btn-sm{ padding:.42rem .78rem; font-size:.82rem; border-radius:7px; }
  .btn-sm:hover{ transform:none; }
  .btn:disabled{ opacity:.55; cursor:default; transform:none !important; box-shadow:none !important; }

  .icon{ width:1.15em; height:1.15em; flex:none; }

  /* ---------- Landing ---------- */
  .landing-page{ position:relative; overflow:hidden; }
  .landing-page::before{
    content:''; position:absolute; top:-220px; right:-160px; width:640px; height:640px; border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(226,113,29,.16), rgba(226,113,29,0) 68%); pointer-events:none;
  }
  .landing-page::after{
    content:''; position:absolute; top:280px; left:-220px; width:560px; height:560px; border-radius:50%;
    background:radial-gradient(circle at 60% 40%, rgba(28,114,147,.14), rgba(28,114,147,0) 68%); pointer-events:none;
  }
  .landing-top{
    position:relative; display:flex; align-items:center; justify-content:space-between;
    padding:1.1rem clamp(16px,4vw,3rem); border-bottom:1px solid var(--border);
  }
  .wordmark{ display:flex; align-items:center; gap:.6rem; font-weight:700; letter-spacing:.01em; }
  .wordmark .dot{
    width:11px; height:11px; border-radius:50%; background:var(--grad-accent);
    box-shadow:0 0 0 4px var(--accent-soft);
  }
  .wordmark span{ font-family:'Newsreader',serif; font-size:1.15rem; font-weight:600; }

  .hero{
    position:relative; max-width:1180px; margin:0 auto; padding:clamp(2.4rem,6vw,4.4rem) clamp(16px,4vw,3rem) 2rem;
    display:grid; grid-template-columns:1.05fr .95fr; gap:clamp(1.5rem,4vw,3rem); align-items:center;
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:.5rem; font-size:.74rem; font-weight:700;
    letter-spacing:.09em; text-transform:uppercase; color:var(--accent);
    background:var(--accent-soft); padding:.32rem .7rem; border-radius:100px; margin-bottom:1.4rem;
  }
  .hero h1{ font-size:clamp(2.2rem,4.6vw,3.6rem); font-weight:600; line-height:1.08; max-width:16ch; color:var(--text); }
  .hero h1 em{ font-style:italic; color:var(--primary); }
  .hero-sub{ max-width:52ch; font-size:1.08rem; line-height:1.6; color:var(--text-muted); margin-top:1.3rem; }
  .hero-actions{ display:flex; flex-wrap:wrap; gap:.9rem; margin-top:2rem; align-items:center; }
  .hero-note{ font-size:.85rem; color:var(--text-muted); }
  .hero-stats{ display:flex; flex-wrap:wrap; gap:clamp(1.4rem,4vw,2.4rem); margin-top:2.4rem; }
  .hero-stat b{ display:block; font-family:'Newsreader',serif; font-size:1.7rem; font-weight:600; color:var(--text); }
  .hero-stat span{ font-size:.78rem; color:var(--text-muted); }

  .hero-visual{
    position:relative; aspect-ratio:1/1; max-width:420px; margin:0 auto; justify-self:center;
  }
  .hero-visual svg{ width:100%; height:100%; }
  .hero-visual-card{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:.9rem 1.1rem;
    box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:.6rem; font-size:.82rem; font-weight:700;
    color:var(--text); white-space:nowrap;
  }
  .hero-visual-card .dot{ width:8px; height:8px; border-radius:50%; background:var(--success); flex:none; }

  .feature-strip{
    position:relative; max-width:1180px; margin:0 auto; padding:1rem clamp(16px,4vw,3rem) 4.5rem;
    display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:1.4rem;
  }
  .feature-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:1.5rem;
    box-shadow:var(--shadow); transition:transform .18s ease, box-shadow .18s ease; position:relative; overflow:hidden;
  }
  .feature-card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--card-accent, var(--grad-primary));
  }
  .feature-card:hover{ transform:translateY(-3px); box-shadow:var(--shadow-lg); }
  .feature-card .icon-badge{
    width:2.5rem; height:2.5rem; border-radius:10px; display:flex; align-items:center; justify-content:center;
    margin-bottom:1rem;
  }
  .feature-card h3{ font-size:1.08rem; font-weight:600; margin-bottom:.5rem; }
  .feature-card p{ font-size:.9rem; color:var(--text-muted); line-height:1.55; }

  .landing-footer{
    position:relative; max-width:1180px; margin:0 auto; padding:0 clamp(16px,4vw,3rem) 3rem; color:var(--text-muted); font-size:.82rem;
  }

  @media (max-width:960px){
    .hero{ grid-template-columns:1fr; }
    .hero-visual{ display:none; }
  }

  /* ---------- App shell ---------- */
  .shell{ display:flex; min-height:100%; }
  .rail{
    width:220px; flex:none; border-right:1px solid var(--border); background:var(--surface);
    display:flex; flex-direction:column; padding:1.1rem .9rem; gap:.2rem;
  }
  .rail-brand{ display:flex; align-items:center; gap:.5rem; padding:.4rem .5rem 1.1rem; }
  .rail-brand span{ font-family:'Newsreader',serif; font-weight:600; font-size:1.05rem; }
  .rail-link{
    display:flex; align-items:center; gap:.7rem; padding:.6rem .65rem; border-radius:9px;
    color:var(--text-muted); font-size:.9rem; font-weight:600; border:none; background:transparent;
    text-align:left; width:100%; position:relative; transition:background .15s ease, color .15s ease;
  }
  .rail-link:hover{ background:var(--surface-2); color:var(--text); }
  .rail-link.active{ background:var(--primary-soft); color:var(--primary-strong); }
  .rail-link.active::before{
    content:''; position:absolute; left:-.9rem; top:.35rem; bottom:.35rem; width:3px; border-radius:3px;
    background:var(--grad-accent);
  }
  .rail-foot{ margin-top:auto; padding:.7rem .5rem 0; border-top:1px solid var(--border); }
  .rail-foot a{ font-size:.78rem; color:var(--text-muted); text-decoration:none; }
  .rail-foot a:hover{ color:var(--primary); }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:1rem;
    padding:.85rem clamp(16px,3vw,2rem); border-bottom:1px solid var(--border); background:var(--surface);
    position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
  }
  .viewing-as{ display:flex; align-items:center; gap:.6rem; font-size:.86rem; color:var(--text-muted); }
  .org-switch{
    font-family:inherit; font-size:.86rem; font-weight:600; color:var(--text);
    background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:.4rem .6rem;
  }
  .content{ padding:clamp(16px,3vw,2rem); max-width:1080px; width:100%; margin:0 auto; }

  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:1rem; margin-bottom:1.4rem; flex-wrap:wrap; }
  .page-head h2{ font-size:1.6rem; font-weight:600; padding-left:.85rem; border-left:4px solid var(--accent); }
  .page-head p{ color:var(--text-muted); font-size:.92rem; margin-top:.3rem; padding-left:.85rem; }

  .toolbar{ display:flex; flex-wrap:wrap; gap:.6rem; margin-bottom:1.3rem; align-items:center; }
  .search-input{
    flex:1; min-width:180px; font-family:inherit; font-size:.9rem; padding:.6rem .8rem;
    border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text);
  }
  .chip{
    font-size:.8rem; font-weight:600; padding:.36rem .72rem; border-radius:100px;
    border:1px solid var(--border); background:var(--surface); color:var(--text-muted);
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .chip:hover{ border-color:var(--primary); color:var(--text); }
  .chip.active{ background:var(--grad-primary); color:#fff; border-color:transparent; box-shadow:var(--glow-primary); }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:1.1rem; }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:1.15rem;
    box-shadow:var(--shadow); transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .org-card:hover{ transform:translateY(-3px); box-shadow:var(--shadow-lg); border-color:var(--primary); }
  .org-card-top{ display:flex; justify-content:flex-end; margin-bottom:.4rem; }
  .org-badge{ font-size:.68rem; font-weight:700; letter-spacing:.03em; padding:.2rem .55rem; border-radius:100px; }
  .org-badge.real{ background:var(--surface-2); color:var(--text-muted); }
  .org-badge.demo{ background:var(--accent-soft); color:var(--accent); }
  .dir-footnote{ font-size:.8rem; color:var(--text-muted); margin-top:1.2rem; max-width:70ch; }
  .org-card h3{ font-size:1.05rem; font-weight:600; margin-bottom:.2rem; }
  .org-tagline{ font-size:.86rem; color:var(--text-muted); margin-bottom:.7rem; }
  .meta-row{ display:flex; flex-wrap:wrap; gap:.5rem; font-size:.78rem; color:var(--text-muted); margin-bottom:.8rem; }
  .meta-row span{ display:inline-flex; align-items:center; gap:.3rem; }
  .tag-row{ display:flex; flex-wrap:wrap; gap:.4rem; margin-bottom:1rem; }
  .tag{ font-size:.74rem; font-weight:600; padding:.24rem .58rem; border-radius:100px; background:var(--primary-soft); color:var(--primary-strong); }
  .tag.accent{ background:var(--accent-soft); color:var(--accent); }
  .card-actions{ display:flex; gap:.5rem; }

  .empty{ color:var(--text-muted); font-size:.9rem; padding:2rem 0; text-align:center; }

  .profile-head{ display:flex; justify-content:space-between; gap:1.2rem; flex-wrap:wrap; align-items:flex-start; margin-bottom:1.6rem; }
  .profile-head h2{ font-size:1.7rem; }
  .profile-grid{ display:grid; grid-template-columns:1.5fr 1fr; gap:1.4rem; }
  .section-label{ font-size:.76rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--text-muted); margin-bottom:.6rem; }
  .list-plain{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.5rem; }
  .list-plain li{ font-size:.9rem; padding:.55rem .7rem; background:var(--surface-2); border-radius:8px; }
  .side-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:1.1rem; margin-bottom:1rem; box-shadow:var(--shadow); }

  .request-composer{ margin-top:1rem; }
  textarea{
    width:100%; font-family:inherit; font-size:.9rem; padding:.7rem .8rem; border-radius:8px;
    border:1px solid var(--border); background:var(--surface); color:var(--text); resize:vertical; min-height:5rem;
  }

  .req-group{ margin-bottom:1.8rem; }
  .req-group-title{ font-size:.95rem; font-weight:700; margin-bottom:.7rem; display:flex; align-items:center; gap:.5rem; }
  .count-pill{ font-size:.72rem; font-weight:700; background:var(--surface-2); color:var(--text-muted); border-radius:100px; padding:.1rem .5rem; }
  .req-card{ display:flex; justify-content:space-between; gap:1rem; align-items:flex-start; flex-wrap:wrap; }
  .req-note{ font-size:.88rem; color:var(--text); line-height:1.5; margin-top:.35rem; max-width:52ch; }
  .req-date{ font-size:.76rem; color:var(--text-muted); margin-top:.4rem; }
  .status-pill{ font-size:.74rem; font-weight:700; padding:.22rem .6rem; border-radius:100px; white-space:nowrap; }
  .status-pending{ background:var(--warning-soft); color:var(--warning); }
  .status-accepted{ background:var(--success-soft); color:var(--success); }
  .status-declined{ background:var(--surface-2); color:var(--text-muted); }

  .thread{ margin-top:.9rem; border-top:1px solid var(--border); padding-top:.9rem; display:flex; flex-direction:column; gap:.6rem; }
  .msg{ max-width:80%; padding:.55rem .75rem; border-radius:10px; font-size:.87rem; line-height:1.45; }
  .msg-them{ background:var(--surface-2); align-self:flex-start; border-bottom-left-radius:3px; }
  .msg-me{ background:var(--primary-soft); color:var(--primary-strong); align-self:flex-end; border-bottom-right-radius:3px; }
  .msg-meta{ font-size:.72rem; color:var(--text-muted); margin-top:.15rem; }
  .msg-form{ display:flex; gap:.5rem; margin-top:.7rem; }
  .msg-form input{ flex:1; font-family:inherit; font-size:.87rem; padding:.55rem .7rem; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); }

  .res-card{ display:flex; flex-direction:column; gap:.55rem; }
  .res-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:.6rem; }
  .res-type{ font-size:.72rem; font-weight:700; padding:.2rem .55rem; border-radius:100px; white-space:nowrap; }
  .res-type.offer{ background:var(--success-soft); color:var(--success); }
  .res-type.need{ background:var(--accent-soft); color:var(--accent); }
  .res-org{ font-size:.8rem; color:var(--text-muted); }
  .res-detail{ font-size:.87rem; color:var(--text); line-height:1.5; }
  .res-date{ font-size:.75rem; color:var(--text-muted); }

  .bp-card{ display:flex; flex-direction:column; gap:.55rem; }
  .bp-summary{ font-size:.87rem; color:var(--text); line-height:1.5; }
  .bp-foot{ display:flex; justify-content:space-between; align-items:center; gap:.6rem; margin-top:.3rem; }
  .adopted-count{ font-size:.78rem; color:var(--text-muted); }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(11,24,38,.45); display:flex; align-items:flex-start;
    justify-content:center; padding:5vh 16px; z-index:50; overflow-y:auto;
  }
  .modal{
    background:var(--surface); border-radius:14px; padding:1.5rem; max-width:460px; width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.25); margin-bottom:5vh;
  }
  .modal h3{ font-size:1.15rem; margin-bottom:1rem; }
  .field{ margin-bottom:.9rem; }
  .field label{ display:block; font-size:.8rem; font-weight:600; color:var(--text-muted); margin-bottom:.35rem; }
  .field input, .field select, .field textarea{
    width:100%; font-family:inherit; font-size:.9rem; padding:.6rem .7rem; border-radius:8px;
    border:1px solid var(--border); background:var(--surface); color:var(--text);
  }
  .field-row{ display:flex; gap:.7rem; }
  .field-row .field{ flex:1; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:.6rem; margin-top:1.2rem; }

  .toast{
    position:fixed; bottom:1.2rem; left:50%; transform:translateX(-50%) translateY(10px); opacity:0;
    background:var(--text); color:var(--bg); padding:.65rem 1.1rem; border-radius:9px; font-size:.86rem;
    font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:80; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- Help board ---------- */
  .seg{ display:inline-flex; flex-wrap:wrap; gap:2px; padding:3px; margin-bottom:1.1rem; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; }
  .seg button{ border:none; background:transparent; font-size:.84rem; font-weight:600; color:var(--text-muted); padding:.42rem .85rem; border-radius:7px; display:inline-flex; align-items:center; gap:.4rem; }
  .seg button:hover{ color:var(--text); }
  .seg button.active{ background:var(--surface); color:var(--text); box-shadow:var(--shadow); }
  .toolbar-label{ font-size:.72rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--text-muted); margin-right:.15rem; }
  .filter-select{ font-family:inherit; font-size:.84rem; font-weight:600; padding:.42rem .6rem; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); max-width:100%; }
  .help-card{ display:flex; flex-direction:column; gap:.55rem; }
  .help-card:hover{ border-color:var(--primary); box-shadow:var(--shadow-lg); }
  .help-top{ display:flex; align-items:center; gap:.4rem; flex-wrap:wrap; }
  .help-top .res-date{ margin-left:auto; }
  .res-type.ask{ background:var(--accent-soft); color:var(--accent); }
  .urgent-pill{ font-size:.72rem; font-weight:700; padding:.2rem .55rem; border-radius:100px; background:var(--danger-soft); color:var(--danger); }
  .help-snippet{ font-size:.87rem; line-height:1.5; color:var(--text); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }

    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function orgById(id){ return DATA.orgs.filter(function(o){ return o.id===id; })[0]; }
  function activeOrg(){ return orgById(state.activeOrgId); }
  function allCauses(){
    var set = {};
    DATA.orgs.forEach(function(o){ o.causes.forEach(function(c){ set[c]=true; }); });
    return Object.keys(set).sort();
  }
  var REGIONS = ['Greater Boston','North America','Latin America','Africa','South Asia','Global'];
  var HELP_CATS = {
    'Groceries & errands':['Elder Care','Food Security'],
    'Elder care & companionship':['Elder Care'],
    'Clean water & sanitation':['Water & Sanitation'],
    'Food & meals':['Food Security'],
    'Housing & repairs':['Housing','Disability & Access'],
    'Health & medical':['Global Health','Community Health'],
    'Education & tutoring':['Education','Youth Development'],
    'Transportation & rides':['Elder Care','Disability & Access'],
    'Jobs & livelihoods':['Workforce Development','Economic Development'],
    'Legal & paperwork':['Legal Aid','Immigrant & Refugee Services'],
    'Disaster & emergency':['Disaster Response'],
    'Energy & solar':['Environment','Economic Development'],
    'Tech & skills':['Workforce Development','Volunteer Mobilization']
  };
  var SCALES = ['Neighborhood','Village','City','Region','Remote'];
  var URGENCIES = ['Ongoing','Urgent','This week','This month','Hiring now','Flexible'];

  function regionOf(o){ return o.region || (/, MA$/.test(o.location) ? 'Greater Boston' : 'North America'); }
  function regionLabel(r){ return r==='Global' ? 'Global / multi-country' : r; }
  function scaleLabel(s){ return s==='Remote' ? 'Remote — anywhere' : s; }
  function personById(id){ return DATA.people.filter(function(p){ return p.id===id; })[0]; }
  function actor(key){
    var i = key.indexOf(':'), kind = key.slice(0,i), id = key.slice(i+1);
    if(kind==='org'){
      var o = orgById(id);
      return { key:key, kind:'org', id:id, name:o.name, role:o.tagline, location:o.location, region:regionOf(o) };
    }
    var p = personById(id);
    return { key:key, kind:'person', id:id, name:p.name, role:p.role, location:p.location, region:p.region };
  }
  function meKey(){ return state.mode==='person' ? 'person:'+state.activePersonId : 'org:'+state.activeOrgId; }
  function me(){ return actor(meKey()); }
  function helpById(id){ return DATA.helpPosts.filter(function(p){ return p.id===id; })[0]; }
  function postLocation(p){ return p.location || actor(p.author).location; }
  function postRegion(p){ return p.region || actor(p.author).region; }
  function myResponse(p){ return p.responses.filter(function(r){ return r.from===meKey(); })[0]; }
  function regionFit(orgRegion, postReg){
    if(orgRegion===postReg) return 3;
    if(orgRegion==='Global') return 1.5;
    if(postReg==='Greater Boston' && orgRegion==='North America') return 1;
    return 0;
  }
  // Organizations whose cause areas and region fit a help post — real and demo alike.
  function suggestOrgs(p){
    var causes = HELP_CATS[p.category] || [], reg = postRegion(p);
    return DATA.orgs.map(function(o){
      var overlap = o.causes.filter(function(c){ return causes.indexOf(c)>-1; }).length;
      var fit = regionFit(regionOf(o), reg);
      return { org:o, score: (overlap && fit) ? overlap*2 + fit : 0 };
    }).filter(function(s){ return s.score>0 && 'org:'+s.org.id!==p.author; })
      .sort(function(a,b){ return b.score-a.score; })
      .slice(0,5).map(function(s){ return s.org; });
  }
  function tabsForMode(){ return state.mode==='person' ? PERSON_TABS : TABS; }
  function defaultTab(){ return state.mode==='person' ? 'help' : 'directory'; }

  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2600);
  }

  function renderLanding(){
    var realCount = DATA.orgs.filter(function(o){ return o.kind==='real'; }).length;
    var demoCount = DATA.orgs.filter(function(o){ return o.kind==='demo'; }).length;
    var bostonCount = DATA.orgs.filter(function(o){ return o.kind==='real' && regionOf(o)==='Greater Boston'; }).length;

    + '</div>'
    + '<div class="hero">'
    +   '<div>'
    +     '<div class="eyebrow">Prototype — mock data throughout</div>'
    +     '<h1>Help that travels from <em>next door to across the world.</em></h1>'
    +     '<p class="hero-sub">Global Neighbors connects people who need a hand — a grocery run in Dorchester, a broken water pump in rural Kenya — with the neighbors, nonprofits, and NGOs who can help. Organizations can also find partners, share spare resources, and swap programs that already work.</p>'
    +     '<div class="hero-actions">'

    +       '<div class="hero-stat"><b>' + realCount + '</b><span>Real nonprofits &amp; NGOs listed</span></div>'
    +       '<div class="hero-stat"><b>' + bostonCount + '</b><span>In Greater Boston</span></div>'

    + '<div class="feature-strip">'
    +   featureCard('accent', ICONS.help, 'Ask for help, or offer it', 'Individuals, families, and community groups post what they need, from errands for an older neighbor to clean water for a village. Volunteers, paid helpers, and organizations reply.')
    +   featureCard('primary', ICONS.directory, 'Find the right partner fast', 'Search real nonprofits and NGOs by cause, region, and city, from Greater Boston to Nairobi, Dhaka, and Medellín.')
    +   featureCard('accent', ICONS.resources, 'Put spare capacity to work', 'Post what you have too much of — storage, training seats, meeting space — and what you’re short on.')

    + '</div>';

  function featureCard(tone, icon, title, body){
    var bg = tone==='accent' ? 'var(--accent-soft)' : 'var(--primary-soft)';
    var fg = tone==='accent' ? 'var(--accent)' : 'var(--primary-strong)';
    var grad = tone==='accent' ? 'var(--grad-accent)' : 'var(--grad-primary)';
    return '<div class="feature-card" style="--card-accent:' + grad + ';">'
      + '<div class="icon-badge" style="background:' + bg + ';color:' + fg + ';">' + icon + '</div>'
      + '<h3>' + title + '</h3><p>' + body + '</p></div>';
  }

  /* ============ RENDER: APP SHELL ============ */
  var TABS = [
    {id:'directory', label:'Directory', icon:ICONS.directory},
    {id:'help', label:'Help Board', icon:ICONS.help},
    {id:'requests', label:'Requests', icon:ICONS.requests},
    {id:'resources', label:'Resources', icon:ICONS.resources},
    {id:'blueprints', label:'Blueprints', icon:ICONS.blueprints},
    {id:'profile', label:'My Profile', icon:ICONS.profile}
  ];
  var PERSON_TABS = [
    {id:'help', label:'Help Board', icon:ICONS.help},
    {id:'directory', label:'Find support', icon:ICONS.directory}
  ];

  function renderApp(){
    var rail = '<div class="rail">'
      + '<div class="rail-brand"><span class="wordmark-dot" style="width:10px;height:10px;border-radius:50%;background:var(--grad-accent);box-shadow:0 0 0 3px var(--accent-soft);display:inline-block;"></span><span>Global Neighbors</span></div>'
      + tabsForMode().map(function(t){
          var active = (state.tab===t.id) ? ' active' : '';
          return '<button class="rail-link' + active + '" data-action="set-tab" data-tab="' + t.id + '">' + t.icon + '<span>' + t.label + '</span></button>';
        }).join('')
      + '<div class="rail-foot"><a href="#" data-action="back-to-landing">← Back to landing</a></div>'
      + '</div>';

    var key = meKey();
    var personOptions = DATA.people.filter(function(p){ return p.selectable; }).map(function(p){
      var v = 'person:' + p.id;
      return '<option value="' + v + '"' + (v===key?' selected':'') + '>' + esc(p.name) + ' — ' + esc(p.location) + '</option>';
    }).join('');
    var orgOptions = DATA.orgs.filter(function(o){ return o.kind==='demo'; }).map(function(o){
      var v = 'org:' + o.id;
      return '<option value="' + v + '"' + (v===key?' selected':'') + '>' + esc(o.name) + '</option>';
    }).join('');

    var m = me();
    var topbar = '<div class="topbar">'
      + '<div class="viewing-as"><label for="actor-switch">Viewing as</label>'
      + '<select id="actor-switch" class="org-switch" data-role="actor-switch">'
      +   '<optgroup label="Individuals &amp; community members">' + personOptions + '</optgroup>'
      +   '<optgroup label="Organizations">' + orgOptions + '</optgroup>'
      + '</select>'
      + '</div>'
      + '<div class="hero-note">' + (m.kind==='person' ? esc(m.role) + ' · ' : '') + esc(m.location) + '</div>'
      + '</div>';

    var body = '';
    if(state.tab==='directory') body = state.selectedOrgId ? renderOrgProfile(state.selectedOrgId, true) : renderDirectory();
    else if(state.tab==='help') body = state.selectedHelpId ? renderHelpDetail(state.selectedHelpId) : renderHelpBoard();
    else if(state.tab==='profile') body = renderOrgProfile(state.activeOrgId, false);
    else if(state.tab==='requests') body = renderRequests();
    else if(state.tab==='resources') body = renderResources();
    else if(state.tab==='blueprints') body = renderBlueprints();

    var main = '<div class="main">' + topbar + '<div class="content">' + body + '</div></div>';
    return '<div class="shell">' + rail + main + '</div>' + renderModal();
  }

  function renderDirectory(){
    var q = state.dirQuery.toLowerCase();
    var isPerson = state.mode==='person';
    var list = DATA.orgs.filter(function(o){ return isPerson || o.id !== state.activeOrgId; }).filter(function(o){
      var hay = (o.name + ' ' + o.tagline + ' ' + o.location + ' ' + o.mission + ' ' + o.causes.join(' ')).toLowerCase();
      var matchesQuery = !q || hay.indexOf(q)>-1;
      var matchesCause = state.dirCause==='All' || o.causes.indexOf(state.dirCause) > -1;
      var matchesSource = state.dirSource==='all' || o.kind===state.dirSource;
      var matchesRegion = state.dirRegion==='All' || regionOf(o)===state.dirRegion;
      return matchesQuery && matchesCause && matchesSource && matchesRegion;
    });

    var regionChips = ['All'].concat(REGIONS).map(function(r){
      var active = r===state.dirRegion ? ' active' : '';
      return '<button class="chip' + active + '" data-action="set-region" data-region="' + esc(r) + '">' + (r==='All' ? 'Everywhere' : esc(regionLabel(r))) + '</button>';
    }).join('');

    var sourceChips = [
      {id:'all', label:'All organizations'},
      {id:'demo', label:'Interactive demo orgs'},
      {id:'real', label:'Real-world directory'}
    ].map(function(s){
      var active = s.id===state.dirSource ? ' active' : '';
      return '<button class="chip' + active + '" data-action="set-source" data-source="' + s.id + '">' + s.label + '</button>';
    }).join('');

    var causeChips = ['All'].concat(allCauses()).map(function(c){
      var active = c===state.dirCause ? ' active' : '';
      return '<button class="chip' + active + '" data-action="set-cause" data-cause="' + esc(c) + '">' + esc(c) + '</button>';
    }).join('');

    var cards = list.map(function(o){
      var isReal = o.kind==='real';
      var badge = isReal
        ? '<span class="org-badge real">Real org</span>'
        : '<span class="org-badge demo">Demo · interactive</span>';
      var metaExtra = isReal ? '' : '<span>' + ICONS.people + o.staff + ' staff</span>';
      var actions = (isReal || isPerson)
        ? '<button class="btn btn-secondary btn-sm" data-action="view-org" data-org="' + o.id + '">View profile</button>'
        : '<button class="btn btn-secondary btn-sm" data-action="view-org" data-org="' + o.id + '">View profile</button>'
          + '<button class="btn btn-ghost btn-sm" data-action="open-composer" data-org="' + o.id + '">Request partnership</button>';
      return '<div class="card org-card">'
        + '<div class="org-card-top">' + badge + '</div>'
        + '<h3>' + esc(o.name) + '</h3>'
        + '<div class="org-tagline">' + esc(o.tagline) + '</div>'
        + '<div class="meta-row">'
        +   '<span>' + ICONS.pin + esc(o.location) + '</span>'
        +   (regionOf(o)==='Global' ? '<span>' + ICONS.globe + 'Works globally</span>' : '')
        +   metaExtra
        + '</div>'
        + '<div class="tag-row">' + o.causes.map(function(c){ return '<span class="tag">' + esc(c) + '</span>'; }).join('') + '</div>'
        + '<div class="card-actions">' + actions + '</div>'
        + '</div>';
    }).join('');

    var head = isPerson
      ? '<h2>Find support</h2><p>Nonprofits, NGOs, and community groups in Greater Boston and around the world. Filter by where you are and what you need, or post on the Help Board and let them come to you.</p>'
      : '<h2>Nonprofit &amp; NGO directory</h2><p>Browse organizations by cause area and region. The list mixes interactive demo orgs with a real-world reference directory covering Greater Boston, national, and international groups.</p>';

    return '<div class="page-head"><div>' + head + '</div><div class="hero-note">' + list.length + ' of ' + (DATA.orgs.length - (isPerson?0:1)) + ' shown</div></div>'
      + '<div class="toolbar">'
      +   '<input class="search-input" type="text" placeholder="Search by name, cause, city, or country…" value="' + esc(state.dirQuery) + '" data-search="dirQuery" aria-label="Search organizations">'
      + '</div>'
      + '<div class="toolbar"><span class="toolbar-label">Where</span>' + regionChips + '</div>'
      + '<div class="toolbar"><span class="toolbar-label">Source</span>' + sourceChips + '</div>'
      + '<div class="toolbar"><span class="toolbar-label">Cause</span>' + causeChips + '</div>'
      + (list.length ? '<div class="grid">' + cards + '</div>' : '<div class="empty">No organizations match that search yet.</div>')
      + '<div class="dir-footnote">Real-organization entries show each organization’s public mission and a link to their official site. No needs, offers, contacts, or help posts are simulated for them. Compiled with reference to '
      +   '<a href="https://www.charitycharge.com/nonprofit-resources/boston-nonprofits/" target="_blank" rel="noopener">Charity Charge, “15 Amazing Boston Nonprofits Championing Change”</a>, '
      +   '<a href="https://nonprofitnewsfeed.com/resource/top-100-nonprofits/" target="_blank" rel="noopener">Nonprofit News Feed, “List of 100 Largest Nonprofits by Revenue”</a>, and each organization’s official website.</div>';
  }

  function renderOrgProfile(orgId, isDrillIn){
    var o = orgById(orgId);
    var isPerson = state.mode==='person';
    var isSelf = !isPerson && orgId === state.activeOrgId;
    var isReal = o.kind === 'real';
    var back = isDrillIn ? '<button class="btn btn-ghost btn-sm" style="margin-bottom:1rem;" data-action="close-org">← Back to ' + (isPerson ? 'Find support' : 'directory') + '</button>' : '';

    var actions;
    if(isReal){
      actions = '<a class="btn btn-secondary btn-sm" href="' + o.website + '" target="_blank" rel="noopener">Visit official site</a>';
    } else if(isSelf){
      actions = '<span class="hero-note">This is how other organizations see your profile.</span>';
    } else if(isPerson){
      actions = '<button class="btn btn-primary btn-sm" data-action="open-modal" data-modal="post-help">Ask for help</button>';
    } else {
      actions = '<button class="btn btn-primary btn-sm" data-action="open-composer" data-org="' + o.id + '">Request partnership</button>';
    }

    var composer = (!isReal && !isPerson && state.composerOrgId === o.id) ? renderComposer(o.id) : '';

    var orgPosts = DATA.helpPosts.filter(function(p){ return p.author === 'org:' + o.id; });
    var postsCard = orgPosts.length
      ? '<div class="card" style="margin-bottom:1rem;"><div class="section-label">On the Help Board</div><div class="suggest">'
        + orgPosts.map(function(p){
            return '<button class="suggest-item" data-action="view-help" data-id="' + p.id + '">' + esc(p.title)
              + '<small>' + (p.type==='ask' ? 'Asking' : 'Offering') + ' · ' + esc(p.category) + ' · ' + p.responses.length + ' repl' + (p.responses.length===1?'y':'ies') + '</small></button>';
          }).join('')
        + '</div></div>'
      : '';

    var metaRow = '<div class="meta-row" style="margin-bottom:1.2rem;">'
      +   '<span>' + ICONS.pin + esc(o.location) + '</span>'
      +   '<span>' + ICONS.globe + esc(regionLabel(regionOf(o))) + '</span>'
      +   (isReal ? '' : ('<span>' + ICONS.people + o.staff + ' staff</span><span>Founded ' + o.founded + '</span>'))
      + '</div>';

    var rightColumn = isReal
      ? '<div class="side-card">'
          + '<div class="section-label">Real organization</div>'
          + '<p style="font-size:.88rem; line-height:1.55; color:var(--text-muted);">Shown for reference from public information. Global Neighbors has no live connection to them yet — no needs, offers, or requests are simulated for real organizations.</p>'
          + '<a class="btn btn-secondary btn-sm" style="margin-top:.7rem;" href="' + o.website + '" target="_blank" rel="noopener">' + esc(o.website.replace('https://','')) + '</a>'
        + '</div>'
      : '<div class="side-card"><div class="section-label">Currently needs</div><ul class="list-plain">' + o.needs.map(function(n){ return '<li>' + esc(n) + '</li>'; }).join('') + '</ul></div>'
        + '<div class="side-card"><div class="section-label">Can offer</div><ul class="list-plain">' + o.offers.map(function(n){ return '<li>' + esc(n) + '</li>'; }).join('') + '</ul></div>'
        + '<div class="side-card"><div class="section-label">Contact</div><p style="font-size:.9rem;">' + esc(o.contact.name) + '<br><span style="color:var(--text-muted);">' + esc(o.contact.role) + '</span></p></div>';

    return back
      + '<div class="profile-head">'
      +   '<div><h2>' + esc(o.name) + '</h2><div class="org-tagline">' + esc(o.tagline) + '</div></div>'
      +   '<div>' + actions + '</div>'
      + '</div>'
      + metaRow
      + '<div class="tag-row">' + o.causes.map(function(c){ return '<span class="tag">' + esc(c) + '</span>'; }).join('') + '</div>'
      + '<div class="profile-grid">'
      +   '<div>'
      +     '<div class="card" style="margin-bottom:1rem;"><div class="section-label">Mission</div><p style="font-size:.94rem; line-height:1.6;">' + esc(o.mission) + '</p></div>'
      +     composer
      +     postsCard
      +   '</div>'
      +   '<div>' + rightColumn + '</div>'
      + '</div>';
  }

  function renderComposer(orgId){
    return '<div class="card request-composer">'
      + '<div class="section-label">Send a partnership request</div>'
      + '<textarea id="composer-text" placeholder="Introduce yourselves and what you’d like to explore together…"></textarea>'
      + '<div class="card-actions" style="margin-top:.7rem;">'
      +   '<button class="btn btn-primary btn-sm" data-action="send-request" data-org="' + orgId + '">Send request</button>'
      +   '<button class="btn btn-ghost btn-sm" data-action="cancel-composer">Cancel</button>'
      + '</div></div>';
  }

  function renderRequests(){
    var mine = state.activeOrgId;
    var incoming = DATA.requests.filter(function(r){ return r.toOrgId===mine && r.status==='pending'; });
    var sent = DATA.requests.filter(function(r){ return r.fromOrgId===mine && r.status==='pending'; });
    var connected = DATA.requests.filter(function(r){ return r.status==='accepted' && (r.fromOrgId===mine || r.toOrgId===mine); });
    var declined = DATA.requests.filter(function(r){ return r.status==='declined' && (r.fromOrgId===mine || r.toOrgId===mine); });

    function counterpart(r){ return orgById(r.fromOrgId===mine ? r.toOrgId : r.fromOrgId); }

    var incomingHtml = incoming.map(function(r){
      var org = counterpart(r);
      return '<div class="card req-card">'
        + '<div><h3 style="font-size:.98rem;">' + esc(org.name) + '</h3><div class="req-note">' + esc(r.note) + '</div><div class="req-date">' + r.date + '</div></div>'
        + '<div class="card-actions"><button class="btn btn-primary btn-sm" data-action="respond-request" data-id="' + r.id + '" data-status="accepted">Accept</button>'
        + '<button class="btn btn-ghost btn-sm" data-action="respond-request" data-id="' + r.id + '" data-status="declined">Decline</button></div>'
        + '</div>';
    }).join('') || '<div class="empty">No incoming requests right now.</div>';

    var sentHtml = sent.map(function(r){
      var org = counterpart(r);
      return '<div class="card req-card">'
        + '<div><h3 style="font-size:.98rem;">' + esc(org.name) + '</h3><div class="req-note">' + esc(r.note) + '</div><div class="req-date">Sent ' + r.date + '</div></div>'
        + '<span class="status-pill status-pending">Awaiting reply</span>'
        + '</div>';
    }).join('') || '<div class="empty">You haven’t sent any requests yet — try the directory.</div>';

    var connectedHtml = connected.map(function(r){
      var org = counterpart(r);
      var open = state.openThreadId === r.id;
      var thread = DATA.threads[r.id] || [];
      var threadHtml = open ? (
        '<div class="thread">' + thread.map(function(m){
          var mine2 = m.from === state.activeOrgId;
          return '<div class="msg ' + (mine2?'msg-me':'msg-them') + '">' + esc(m.text) + '<div class="msg-meta">' + (mine2?'You':esc(orgById(m.from).name)) + ' · ' + m.date + '</div></div>';
        }).join('')
        + '<form class="msg-form" data-action="send-message" data-thread="' + r.id + '">'
        +   '<input type="text" placeholder="Write a message…" required>'
        +   '<button class="btn btn-primary btn-sm" type="submit">Send</button>'
        + '</form></div>'
      ) : '';
      return '<div class="card req-card" style="flex-direction:column; align-items:stretch;">'
        + '<div style="display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap;">'
        +   '<div><h3 style="font-size:.98rem;">' + esc(org.name) + '</h3><div class="req-note">' + esc(r.note) + '</div></div>'
        +   '<button class="btn btn-secondary btn-sm" data-action="toggle-thread" data-id="' + r.id + '">' + (open?'Hide messages':'Open messages') + '</button>'
        + '</div>' + threadHtml
        + '</div>';
    }).join('') || '<div class="empty">No connections yet — accept a request to start messaging.</div>';

    var declinedHtml = declined.map(function(r){
      var org = counterpart(r);
      return '<div class="card req-card">'
        + '<div><h3 style="font-size:.98rem;">' + esc(org.name) + '</h3><div class="req-note">' + esc(r.note) + '</div>'
        + (r.declineNote ? '<div class="req-date">Note: ' + esc(r.declineNote) + '</div>' : '') + '</div>'
        + '<span class="status-pill status-declined">Declined</span></div>';
    }).join('');

    return '<div class="page-head"><div><h2>Partnership requests</h2><p>Manage requests to and from other organizations.</p></div></div>'
      + '<div class="req-group"><div class="req-group-title">Incoming <span class="count-pill">' + incoming.length + '</span></div>' + incomingHtml + '</div>'
      + '<div class="req-group"><div class="req-group-title">Sent <span class="count-pill">' + sent.length + '</span></div>' + sentHtml + '</div>'
      + '<div class="req-group"><div class="req-group-title">Connected <span class="count-pill">' + connected.length + '</span></div>' + connectedHtml + '</div>'
      + (declined.length ? '<div class="req-group"><div class="req-group-title">Declined <span class="count-pill">' + declined.length + '</span></div>' + declinedHtml + '</div>' : '');
  }

  function renderResources(){
    var categories = ['All'].concat(Object.keys(DATA.resources.reduce(function(acc,r){ acc[r.category]=true; return acc; }, {})).sort());
    var list = DATA.resources.filter(function(r){
      var matchesType = state.resFilter==='all' || r.type===state.resFilter;
      var matchesCat = state.resCategory==='All' || r.category===state.resCategory;
      return matchesType && matchesCat;
    }).slice().reverse();

    var typeChips = ['all','offer','need'].map(function(t){
      var label = t==='all'?'All':(t==='offer'?'Offering':'Needing');
      var active = t===state.resFilter?' active':'';
      return '<button class="chip' + active + '" data-action="set-res-filter" data-filter="' + t + '">' + label + '</button>';
    }).join('');

    var catChips = categories.map(function(c){
      var active = c===state.resCategory?' active':'';
      return '<button class="chip' + active + '" data-action="set-res-category" data-cat="' + esc(c) + '">' + esc(c) + '</button>';
    }).join('');

    var cards = list.map(function(r){
      var org = orgById(r.orgId);
      return '<div class="card res-card">'
        + '<div class="res-top"><span class="res-type ' + r.type + '">' + (r.type==='offer'?'Offering':'Needing') + '</span><span class="res-date">' + r.posted + '</span></div>'
        + '<h3 style="font-size:1rem; font-weight:600;">' + esc(r.title) + '</h3>'
        + '<div class="res-org">' + esc(org.name) + ' · ' + esc(org.location) + '</div>'
        + '<div class="res-detail">' + esc(r.detail) + '</div>'
        + '<div class="card-actions">'
        +   '<span class="tag">' + esc(r.category) + '</span>'
        + '</div>'
        + '<div class="card-actions">'
        +   '<button class="btn btn-secondary btn-sm" data-action="respond-resource" data-id="' + r.id + '">' + (r.orgId===state.activeOrgId ? 'This is yours' : "I'm interested") + '</button>'
        + '</div>'
        + '</div>';
    }).join('');

    return '<div class="page-head">'
      +   '<div><h2>Resources</h2><p>What organizations have spare, and what they’re short on.</p></div>'
      +   '<button class="btn btn-primary" data-action="open-modal" data-modal="post-resource">+ Post a resource</button>'
      + '</div>'
      + '<div class="toolbar">' + typeChips + '</div>'
      + '<div class="toolbar">' + catChips + '</div>'
      + (list.length ? '<div class="grid">' + cards + '</div>' : '<div class="empty">Nothing matches those filters yet.</div>');
  }

  function renderBlueprints(){
    var list = DATA.blueprints.slice().reverse();
    var cards = list.map(function(b){
      var org = orgById(b.orgId);
      return '<div class="card bp-card">'
        + '<div class="tag-row">' + b.tags.map(function(t){ return '<span class="tag accent">' + esc(t) + '</span>'; }).join('') + '</div>'
        + '<h3 style="font-size:1.02rem; font-weight:600;">' + esc(b.title) + '</h3>'
        + '<div class="res-org">Shared by ' + esc(org.name) + '</div>'
        + '<div class="bp-summary">' + esc(b.summary) + '</div>'
        + '<div class="bp-foot">'
        +   '<span class="adopted-count">Adopted by ' + b.adopted + ' organizations</span>'
        +   (b._adopted
              ? '<button class="btn btn-secondary btn-sm" disabled>Adopted ✓</button>'
              : '<button class="btn btn-secondary btn-sm" data-action="adopt-blueprint" data-id="' + b.id + '">Adopt this blueprint</button>')

  /* ============ RENDER: HELP BOARD ============ */
  function payTag(pay){
    var label = pay.kind==='volunteer' ? 'Volunteer'
      : pay.kind==='paid' ? 'Paid' + (pay.label ? ' · ' + pay.label : '')
      : pay.label || (pay.kind==='funding' ? 'Needs funding' : 'Stipend');
    return '<span class="pay-tag ' + pay.kind + '">' + esc(label) + '</span>';
  }
  function statusPill(p){
    if(p.status==='resolved') return '<span class="status-pill status-declined">Resolved</span>';
    if(p.status==='in-progress') return '<span class="status-pill status-accepted">Help underway</span>';
    return '';
  }
  function repliesLabel(n){ return n===0 ? 'No replies yet' : n + (n===1 ? ' reply' : ' replies'); }
  function whoLine(a){
    return esc(a.name) + (a.kind==='org' ? '<span class="kind-badge">Org</span>' : '');
  }

  function helpCard(p){
    var a = actor(p.author);
    var mine = p.author===meKey();
    var mr = myResponse(p);
    var cta;
    if(mine) cta = '<button class="btn btn-secondary btn-sm" data-action="view-help" data-id="' + p.id + '">Manage post</button>';
    else if(mr) cta = '<button class="btn btn-secondary btn-sm" data-action="view-help" data-id="' + p.id + '">View your reply</button>';
    else if(p.status==='resolved') cta = '<button class="btn btn-ghost btn-sm" data-action="view-help" data-id="' + p.id + '">Details</button>';
    else cta = '<button class="btn btn-ghost btn-sm" data-action="view-help" data-id="' + p.id + '">Details</button>'
      + '<button class="btn btn-primary btn-sm" data-action="view-help" data-id="' + p.id + '" data-compose="1">' + (p.type==='ask' ? 'I can help' : 'Request this') + '</button>';
    return '<div class="card help-card">'
      + '<div class="help-top"><span class="res-type ' + p.type + '">' + (p.type==='ask' ? 'Asking for help' : 'Offering help') + '</span>'
      +   (p.urgency==='Urgent' ? '<span class="urgent-pill">Urgent</span>' : '') + statusPill(p)
      +   '<span class="res-date">' + esc(p.posted) + '</span></div>'
      + '<h3 style="font-size:1rem; font-weight:600;">' + esc(p.title) + '</h3>'
      + '<div class="res-org">' + whoLine(a) + ' · ' + esc(postLocation(p)) + '</div>'
      + '<div class="help-snippet">' + esc(p.detail) + '</div>'
      + '<div class="tag-row" style="margin-bottom:0;"><span class="tag">' + esc(p.category) + '</span>' + payTag(p.pay) + '<span class="tag muted">' + esc(scaleLabel(p.scale)) + '</span></div>'
      + '<div class="help-foot"><span class="reply-count">' + repliesLabel(p.responses.length) + '</span><div class="card-actions">' + cta + '</div></div>'
      + '</div>';
  }

  function renderHelpBoard(){
    var key = meKey();
    var mineList = DATA.helpPosts.filter(function(p){ return p.author===key; });
    var helpingList = DATA.helpPosts.filter(function(p){ return p.author!==key && myResponse(p); });
    var base = state.helpView==='mine' ? mineList : state.helpView==='helping' ? helpingList : DATA.helpPosts;
    var q = state.helpQuery.toLowerCase();
    var list = base.filter(function(p){
      if(state.helpView!=='browse') return true;
      var hay = (p.title + ' ' + p.detail + ' ' + p.category + ' ' + postLocation(p) + ' ' + actor(p.author).name).toLowerCase();
      var payKind = p.pay.kind==='stipend' ? 'paid' : p.pay.kind;
      return (!q || hay.indexOf(q)>-1)
        && (state.helpType==='all' || p.type===state.helpType)
        && (state.helpRegion==='All' || postRegion(p)===state.helpRegion)
        && (state.helpCat==='All' || p.category===state.helpCat)
        && (state.helpPay==='all' || payKind===state.helpPay);
    });

    var seg = '<div class="seg" role="tablist">' + [
      {id:'browse', label:'Browse all', n:DATA.helpPosts.length},
      {id:'mine', label:'My posts', n:mineList.length},
      {id:'helping', label:'I’m helping', n:helpingList.length}
    ].map(function(s){
      return '<button role="tab" aria-selected="' + (state.helpView===s.id) + '" class="' + (state.helpView===s.id?'active':'') + '" data-action="set-help-view" data-view="' + s.id + '">' + s.label + ' <span class="count-pill">' + s.n + '</span></button>';
    }).join('') + '</div>';

    function chips(field, options){
      return options.map(function(o){
        var active = state[field]===o[0] ? ' active' : '';
        return '<button class="chip' + active + '" data-action="set-help-filter" data-field="' + field + '" data-value="' + esc(o[0]) + '">' + esc(o[1]) + '</button>';
      }).join('');
    }

    var filters = state.helpView!=='browse' ? '' :
        '<div class="toolbar"><input class="search-input" type="text" placeholder="Search posts: groceries, water, tutoring, Nairobi…" value="' + esc(state.helpQuery) + '" data-search="helpQuery" aria-label="Search help posts">'
      +   '<select class="filter-select" data-role="help-cat" aria-label="Category"><option value="All">All categories</option>'
      +     Object.keys(HELP_CATS).map(function(c){ return '<option' + (c===state.helpCat?' selected':'') + '>' + esc(c) + '</option>'; }).join('')
      +   '</select></div>'
      + '<div class="toolbar">' + chips('helpType', [['all','Asks & offers'],['ask','Asking for help'],['offer','Offering help']])
      +   '<span style="width:.6rem;"></span>' + chips('helpPay', [['all','Any'],['volunteer','Volunteer'],['paid','Paid & stipend'],['funding','Needs funding']]) + '</div>'
      + '<div class="toolbar"><span class="toolbar-label">Where</span>' + chips('helpRegion', [['All','Everywhere']].concat(REGIONS.filter(function(r){ return r!=='Global'; }).map(function(r){ return [r,r]; }))) + '</div>';

    var empty = state.helpView==='mine' ? 'You haven’t posted anything yet. Ask for a hand, or offer one.'
      : state.helpView==='helping' ? 'You haven’t replied to any posts yet. Browse the board to find someone you can help.'
      : 'Nothing matches those filters yet.';

    var sub = state.mode==='person'
      ? 'Ask neighbors, volunteers, and organizations for a hand, or offer one. Posts range from grocery runs down the street to clean water across the world.'
      : 'See what people and communities need, reply as your organization, or post paid roles and volunteer asks.';

    return '<div class="page-head">'
      +   '<div><h2>Help Board</h2><p>' + sub + '</p></div>'
      +   '<button class="btn btn-primary" data-action="open-modal" data-modal="post-help">+ Post to the Help Board</button>'
      + '</div>'
      + seg + filters
      + (list.length ? '<div class="grid">' + list.map(helpCard).join('') + '</div>' : '<div class="empty">' + empty + '</div>');
  }

  function renderHelpThread(p, r){
    var key = meKey();
    var msgs = [{ from:r.from, text:r.text, date:r.date }].concat(r.thread);
    return '<div class="thread">' + msgs.map(function(m){
        var mine = m.from===key;
        return '<div class="msg ' + (mine?'msg-me':'msg-them') + '">' + esc(m.text) + '<div class="msg-meta">' + (mine ? 'You' : esc(actor(m.from).name)) + ' · ' + esc(m.date) + '</div></div>';
      }).join('')
      + (p.status==='resolved' ? '' :
        '<form class="msg-form" data-action="send-help-message" data-post="' + p.id + '" data-resp="' + r.id + '">'
        + '<input type="text" placeholder="Write a message…" aria-label="Message" required>'
        + '<button class="btn btn-primary btn-sm" type="submit">Send</button></form>')
      + '</div>';
  }

  function responseStatus(r){
    if(r.status==='accepted') return '<span class="status-pill status-accepted">Accepted</span>';
    if(r.status==='declined') return '<span class="status-pill status-declined">Declined</span>';
    return '<span class="status-pill status-pending">Awaiting reply</span>';
  }

  function renderHelpDetail(id){
    var p = helpById(id);
    var a = actor(p.author);
    var key = meKey();
    var mine = p.author===key;
    var mr = myResponse(p);

    var head = '<button class="btn btn-ghost btn-sm" style="margin-bottom:1rem;" data-action="close-help">← Back to Help Board</button>'
      + '<div class="profile-head">'
      +   '<div><div class="help-top" style="margin-bottom:.6rem;"><span class="res-type ' + p.type + '">' + (p.type==='ask' ? 'Asking for help' : 'Offering help') + '</span>'
      +     (p.urgency==='Urgent' ? '<span class="urgent-pill">Urgent</span>' : '') + statusPill(p) + '</div>'
      +   '<h2>' + esc(p.title) + '</h2></div>'
      +   (mine && p.status!=='resolved' ? '<button class="btn btn-secondary btn-sm" data-action="resolve-help" data-id="' + p.id + '">Mark as resolved</button>' : '')
      + '</div>'
      + '<div class="meta-row" style="margin-bottom:.8rem;"><span>' + ICONS.pin + esc(postLocation(p)) + '</span><span>' + ICONS.globe + esc(scaleLabel(p.scale)) + '</span><span>Posted ' + esc(p.posted) + '</span></div>'
      + '<div class="tag-row"><span class="tag">' + esc(p.category) + '</span>' + payTag(p.pay) + '<span class="tag muted">' + esc(p.urgency) + '</span></div>';

    var replies;
    if(mine){
      replies = '<div class="section-label" style="margin-top:.4rem;">Replies (' + p.responses.length + ')</div>'
        + (p.responses.length ? p.responses.map(function(r){
            var ra = actor(r.from);
            var open = state.openHelpThread===r.id;
            var btns = (r.status==='pending' && p.status!=='resolved')
              ? '<button class="btn btn-primary btn-sm" data-action="respond-help" data-post="' + p.id + '" data-resp="' + r.id + '" data-status="accepted">Accept</button>'
                + '<button class="btn btn-ghost btn-sm" data-action="respond-help" data-post="' + p.id + '" data-resp="' + r.id + '" data-status="declined">Decline</button>'
              : '';
            return '<div class="card response">'
              + '<div class="response-head"><div><h3 style="font-size:.98rem;">' + whoLine(ra) + '</h3><div class="res-org">' + esc(ra.role) + ' · ' + esc(ra.location) + '</div></div>' + responseStatus(r) + '</div>'
              + (open ? renderHelpThread(p, r) : '<div class="req-note">' + esc(r.text) + '</div>')
              + '<div class="card-actions" style="margin-top:.7rem;">' + btns
              +   '<button class="btn btn-secondary btn-sm" data-action="toggle-help-thread" data-id="' + r.id + '">' + (open ? 'Hide messages' : 'Messages (' + (r.thread.length + 1) + ')') + '</button></div>'
              + '</div>';
          }).join('') : '<div class="card empty" style="padding:1.4rem;">No replies yet. Matching organizations are listed on the right, and you can reach out to them directly.</div>');
    } else if(mr){
      replies = '<div class="card response"><div class="response-head"><div class="section-label" style="margin:0;">Your reply</div>' + responseStatus(mr) + '</div>' + renderHelpThread(p, mr) + '</div>';
    } else if(p.status==='resolved'){
      replies = '<div class="card empty" style="padding:1.4rem;">This post has been resolved. Thank you, neighbors!</div>';
    } else {
      replies = '<div class="card request-composer">'
        + '<div class="section-label">' + (p.type==='ask' ? 'Offer to help' : 'Request this help') + '</div>'
        + '<textarea id="help-reply-text" placeholder="' + (p.type==='ask' ? 'Say how you can help and when you’re available…' : 'Say what you need and when…') + '"></textarea>'
        + '<div class="card-actions" style="margin-top:.7rem;"><button class="btn btn-primary btn-sm" data-action="send-help-reply" data-id="' + p.id + '">Send reply</button></div>'
        + '<p class="posting-as" style="margin:.7rem 0 0;">Replying as ' + esc(me().name) + '. Share personal details only once you’re comfortable.</p>'
        + '</div>';
    }

    var suggestions = suggestOrgs(p);
    var side = '<div class="side-card"><div class="section-label">Posted by</div><p style="font-size:.92rem; font-weight:600;">' + whoLine(a) + '</p>'
      +   '<p class="res-org" style="margin-top:.2rem;">' + esc(a.role) + '<br>' + esc(a.location) + '</p>'
      +   (a.kind==='org' ? '<button class="btn btn-ghost btn-sm" style="margin-top:.7rem;" data-action="view-org-from-help" data-org="' + a.id + '">View organization</button>' : '')
      + '</div>'
      + '<div class="side-card"><div class="section-label">Organizations working on this</div>'
      +   (suggestions.length ? '<div class="suggest">' + suggestions.map(function(o){
            return '<button class="suggest-item" data-action="view-org-from-help" data-org="' + o.id + '">' + esc(o.name)
              + '<small>' + (o.kind==='real' ? 'Real org' : 'Demo org') + ' · ' + esc(regionLabel(regionOf(o))) + '</small></button>';
          }).join('') + '</div>' : '<p class="res-org">No close matches in the directory yet.</p>')
      +   '<p class="res-org" style="margin-top:.7rem; font-size:.74rem;">Matched by cause area and region. Real organizations are shown for reference only and have not seen this post.</p>'
      + '</div>';

    return head
      + '<div class="profile-grid">'
      +   '<div><div class="card" style="margin-bottom:1rem;"><div class="section-label">Details</div><p style="font-size:.94rem; line-height:1.6;">' + esc(p.detail) + '</p></div>' + replies + '</div>'
      +   '<div>' + side + '</div>'
      + '</div>';
  }

  function renderModal(){
    if(!state.modal) return '';
    if(state.modal==='post-help'){
      var m = me();
      var opts = function(list, sel){ return list.map(function(v){ return '<option' + (v===sel?' selected':'') + '>' + esc(v) + '</option>'; }).join(''); };
      return '<div class="modal-backdrop" data-action="close-modal">'
        + '<div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="help-modal-title" onclick="event.stopPropagation()">'

        +   '<p class="posting-as">Posting as ' + esc(m.name) + (m.kind==='org' ? ' (organization)' : '') + '</p>'
        +   '<form data-action="submit-help">'
        +     '<div class="field-row">'
        +       '<div class="field"><label for="hp-type">I’m…</label><select id="hp-type"><option value="ask">Asking for help</option><option value="offer">Offering help</option></select></div>'

        +     '<div class="field-row">'

        +       '<div class="field"><label for="hp-urgency">Timing</label><select id="hp-urgency">' + opts(URGENCIES) + '</select></div>'

        +     '<div class="field-row">'

        +     '</div>'
        +   '</form>'
        + '</div></div>';
    }
    if(state.modal==='post-resource'){
      return '<div class="modal-backdrop" data-action="close-modal">'
        + '<div class="modal" onclick="event.stopPropagation()">'
        +   '<h3>Post a resource</h3>'
        +   '<form data-action="submit-resource">'
        +     '<div class="field-row">'
        +       '<div class="field"><label for="res-type">Type</label><select id="res-type"><option value="offer">Offering</option><option value="need">Needing</option></select></div>'
        +       '<div class="field"><label for="res-cat">Category</label><select id="res-cat">'
        +         ['Volunteers','Storage & Equipment','Training & Curriculum','Transportation','Space','Software & Tools','Funding'].map(function(c){ return '<option>' + c + '</option>'; }).join('')
        +       '</select></div>'
        +     '</div>'
        +     '<div class="field"><label for="res-title">Title</label><input id="res-title" type="text" required placeholder="e.g. Spare van, weekday mornings"></div>'
        +     '<div class="field"><label for="res-detail">Details</label><textarea id="res-detail" required placeholder="A sentence or two of context…"></textarea></div>'
        +     '<div class="modal-actions">'
        +       '<button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>'
        +       '<button type="submit" class="btn btn-primary">Post</button>'
        +     '</div>'
        +   '</form>'
        + '</div></div>';
    }
    return '<div class="modal-backdrop" data-action="close-modal">'
      + '<div class="modal" onclick="event.stopPropagation()">'
      +   '<h3>Share a blueprint</h3>'
      +   '<form data-action="submit-blueprint">'
      +     '<div class="field"><label for="bp-title">Title</label><input id="bp-title" type="text" required placeholder="e.g. Volunteer onboarding checklist"></div>'
      +     '<div class="field"><label for="bp-summary">Summary</label><textarea id="bp-summary" required placeholder="What does it help another org do?"></textarea></div>'
      +     '<div class="field"><label for="bp-tags">Tags (comma separated)</label><input id="bp-tags" type="text" placeholder="e.g. Operations, Volunteer Management"></div>'
      +     '<div class="modal-actions">'
      +       '<button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>'
      +       '<button type="submit" class="btn btn-primary">Share</button>'
      +     '</div>'
      +   '</form>'
      + '</div></div>';
  }

  /* ============ RENDER DISPATCH ============ */
  function render(){
    var root = document.getElementById('root');
    root.innerHTML = state.view==='landing' ? renderLanding() : renderApp();
    if(state.tab==='directory' && !state.selectedOrgId){
      var input = document.querySelector('.search-input');
      if(input && document.activeElement !== input){ /* no-op, focus preserved by user click flow */ }
    }
  }

  /* ============ EVENTS ============ */
  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.getAttribute('data-action');

    if(action==='enter-app'){
      state.view='app';
      state.mode = el.getAttribute('data-mode')==='person' ? 'person' : 'org';
      state.tab = defaultTab();
      state.selectedOrgId=null; state.selectedHelpId=null;
      render(); window.scrollTo(0,0); return;
    }
    if(action==='back-to-landing'){ e.preventDefault(); state.view='landing'; render(); return; }
    if(action==='set-tab'){
      state.tab = el.getAttribute('data-tab');
      state.selectedOrgId=null; state.composerOrgId=null; state.selectedHelpId=null;
      render(); return;
    }
    if(action==='set-region'){ state.dirRegion = el.getAttribute('data-region'); render(); return; }
    if(action==='set-help-view'){ state.helpView = el.getAttribute('data-view'); render(); return; }
    if(action==='set-help-filter'){ state[el.getAttribute('data-field')] = el.getAttribute('data-value'); render(); return; }
    if(action==='view-help'){
      state.tab='help'; state.selectedHelpId = el.getAttribute('data-id'); state.selectedOrgId=null; state.openHelpThread=null;
      render(); window.scrollTo(0,0);
      if(el.getAttribute('data-compose')){ var ta = document.getElementById('help-reply-text'); if(ta) ta.focus(); }
      return;
    }
    if(action==='close-help'){ state.selectedHelpId=null; state.openHelpThread=null; render(); return; }
    if(action==='view-org-from-help'){
      state.tab='directory'; state.selectedOrgId = el.getAttribute('data-org'); state.composerOrgId=null; state.selectedHelpId=null;
      render(); window.scrollTo(0,0); return;
    }
    if(action==='send-help-reply'){
      var hp = helpById(el.getAttribute('data-id'));
      var ta2 = document.getElementById('help-reply-text');
      var reply = ta2 ? ta2.value.trim() : '';
      if(!reply){ toast('Add a short note before sending.'); return; }
      hp.responses.push({ id:'hr'+(nextId++), from:meKey(), text:reply, date:'Just now', status:'pending', thread:[] });
      toast('Reply sent to ' + actor(hp.author).name + '.');
      render(); return;
    }
    if(action==='respond-help'){
      var post = helpById(el.getAttribute('data-post')), rid2 = el.getAttribute('data-resp'), st = el.getAttribute('data-status');
      post.responses.forEach(function(r){ if(r.id===rid2){ r.status = st; } });
      if(st==='accepted'){ if(post.status==='open') post.status='in-progress'; state.openHelpThread = rid2; }
      toast(st==='accepted' ? 'Accepted. Say hello and sort out the details.' : 'Reply declined.');
      render(); return;
    }
    if(action==='toggle-help-thread'){
      var htid = el.getAttribute('data-id');
      state.openHelpThread = state.openHelpThread===htid ? null : htid;
      render(); return;
    }
    if(action==='resolve-help'){
      helpById(el.getAttribute('data-id')).status='resolved';
      toast('Marked as resolved. Thanks for closing the loop!');
      render(); return;
    }
    if(action==='view-org'){ state.selectedOrgId = el.getAttribute('data-org'); render(); return; }
    if(action==='close-org'){ state.selectedOrgId=null; state.composerOrgId=null; render(); return; }
    if(action==='open-composer'){ state.selectedOrgId = el.getAttribute('data-org'); state.composerOrgId = el.getAttribute('data-org'); render(); return; }
    if(action==='cancel-composer'){ state.composerOrgId=null; render(); return; }
    if(action==='send-request'){
      var toOrg = el.getAttribute('data-org');
      var textEl = document.getElementById('composer-text');
      var text = textEl ? textEl.value.trim() : '';
      if(!text){ toast('Add a short note before sending.'); return; }
      DATA.requests.push({ id:'r'+(nextId++), fromOrgId:state.activeOrgId, toOrgId:toOrg, status:'pending', note:text, date:'Just now' });
      state.composerOrgId=null;
      toast('Partnership request sent to ' + orgById(toOrg).name + '.');
      render(); return;
    }
    if(action==='respond-request'){
      var id = el.getAttribute('data-id'), status = el.getAttribute('data-status');
      DATA.requests.forEach(function(r){ if(r.id===id){ r.status=status; if(status==='declined'){ r.declineNote=''; } } });
      if(status==='accepted' && !DATA.threads[id]) DATA.threads[id]=[];
      toast(status==='accepted' ? 'Request accepted — you’re connected.' : 'Request declined.');
      render(); return;
    }
    if(action==='toggle-thread'){
      var tid = el.getAttribute('data-id');
      state.openThreadId = state.openThreadId===tid ? null : tid;
      render(); return;
    }
    if(action==='set-cause'){ state.dirCause = el.getAttribute('data-cause'); render(); return; }
    if(action==='set-source'){ state.dirSource = el.getAttribute('data-source'); render(); return; }
    if(action==='set-res-filter'){ state.resFilter = el.getAttribute('data-filter'); render(); return; }
    if(action==='set-res-category'){ state.resCategory = el.getAttribute('data-cat'); render(); return; }
    if(action==='respond-resource'){
      var rid = el.getAttribute('data-id');
      var res = DATA.resources.filter(function(r){ return r.id===rid; })[0];
      if(res && res.orgId!==state.activeOrgId) toast('Interest sent to ' + orgById(res.orgId).name + '.');
      return;
    }
    if(action==='adopt-blueprint'){
      var bid = el.getAttribute('data-id');
      DATA.blueprints.forEach(function(b){ if(b.id===bid){ b.adopted += 1; b._adopted = true; } });
      toast('Added to your adopted blueprints.');
      render(); return;
    }
    if(action==='open-modal'){ state.modal = el.getAttribute('data-modal'); render(); return; }
    if(action==='close-modal'){ state.modal=null; render(); return; }
  });

  document.addEventListener('input', function(e){
    var field = e.target.getAttribute('data-search');
    if(field){
      state[field] = e.target.value;
      var caret = e.target.selectionStart;
      render();
      var again = document.querySelector('[data-search="' + field + '"]');
      if(again){ again.focus(); try{ again.setSelectionRange(caret, caret); }catch(err){} }
    }
  });

  document.addEventListener('change', function(e){
    var role = e.target.getAttribute('data-role');
    if(role==='actor-switch'){
      var v = e.target.value, i = v.indexOf(':');
      state.mode = v.slice(0,i)==='person' ? 'person' : 'org';
      if(state.mode==='person') state.activePersonId = v.slice(i+1); else state.activeOrgId = v.slice(i+1);
      state.selectedOrgId=null; state.composerOrgId=null; state.openThreadId=null; state.openHelpThread=null;
      var allowed = tabsForMode().some(function(t){ return t.id===state.tab; });
      if(!allowed) state.tab = defaultTab();
      // Stay on an open help post when switching — handy for seeing both sides of a conversation.
      render();
      toast('Now viewing as ' + me().name + '.');
    }
    if(role==='help-cat'){ state.helpCat = e.target.value; render(); }
  });

  document.addEventListener('submit', function(e){
    var form = e.target;
    var action = form.getAttribute('data-action');
    if(action==='send-help-message'){
      e.preventDefault();
      var hin = form.querySelector('input');
      var htext = hin.value.trim();
      if(!htext) return;
      var hpost = helpById(form.getAttribute('data-post')), hrid = form.getAttribute('data-resp');
      hpost.responses.forEach(function(r){ if(r.id===hrid) r.thread.push({ from:meKey(), text:htext, date:'Just now' }); });
      render();
      var next = document.querySelector('form[data-action="send-help-message"] input');
      if(next) next.focus();
      return;
    }
    if(action==='submit-help'){
      e.preventDefault();
      var g = function(id){ return document.getElementById(id).value.trim(); };
      if(!g('hp-title') || !g('hp-detail')) return;
      var payKind = g('hp-pay');
      DATA.helpPosts.unshift({
        id:'h'+(nextId++), author:meKey(), type:g('hp-type'), category:g('hp-cat'), scale:g('hp-scale'),
        title:g('hp-title'), detail:g('hp-detail'), location:g('hp-loc') || me().location, region:g('hp-region'),
        pay:{ kind:payKind, label:g('hp-paylabel') }, urgency:g('hp-urgency'), posted:'Just now', status:'open', responses:[]
      });
      state.modal=null; state.tab='help'; state.helpView='mine'; state.selectedHelpId=null; state.selectedOrgId=null;
      toast('Posted to the Help Board.');
      render(); window.scrollTo(0,0);
      return;
    }
    if(action==='send-message'){
      e.preventDefault();
      var input = form.querySelector('input');
      var text = input.value.trim();
      if(!text) return;
      var threadId = form.getAttribute('data-thread');
      if(!DATA.threads[threadId]) DATA.threads[threadId]=[];
      DATA.threads[threadId].push({ from:state.activeOrgId, text:text, date:'Just now' });
      render();
      return;
    }
    if(action==='submit-resource'){
      e.preventDefault();
      var type = document.getElementById('res-type').value;
      var cat = document.getElementById('res-cat').value;
      var title = document.getElementById('res-title').value.trim();
      var detail = document.getElementById('res-detail').value.trim();
      if(!title || !detail) return;
      DATA.resources.push({ id:'res'+(nextId++), orgId:state.activeOrgId, type:type, category:cat, title:title, detail:detail, posted:'Just now' });
      state.modal=null;
      toast('Resource posted.');
      render();
      return;
    }
    if(action==='submit-blueprint'){
      e.preventDefault();
      var btitle = document.getElementById('bp-title').value.trim();
      var summary = document.getElementById('bp-summary').value.trim();
      var tagsRaw = document.getElementById('bp-tags').value.trim();
      if(!btitle || !summary) return;
      var tags = tagsRaw ? tagsRaw.split(',').map(function(t){ return t.trim(); }).filter(Boolean) : ['General'];
      DATA.blueprints.push({ id:'bp'+(nextId++), orgId:state.activeOrgId, title:btitle, summary:summary, tags:tags, adopted:0 });
      state.modal=null;
      toast('Blueprint shared with the network.');
      render();
      return;
    }
  });

  document.addEventListener('keydown', function(e){
    if(e.key==='Escape' && state.modal){ state.modal=null; render(); }
  });

  render();
})();
</script>
