<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Global Neighbors connects people who need help with neighbors, nonprofits, and NGOs, from Greater Boston to the world.">
<title>Global Neighbors</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#FAFBFC;
    --surface:#FFFFFF;
    --surface-2:#F0F4F7;
    --border:#DEE6EC;
    --text:#132A46;
    --text-muted:#5B6B82;
    --primary:#1C7293;
    --primary-strong:#0F4C5C;
    --primary-soft:#E6F0F3;
    --accent:#E2711D;
    --accent-soft:#FCEADA;
    --success:#2F8F5B;
    --success-soft:#E4F4EB;
    --warning:#B8790E;
    --warning-soft:#FBF0DC;
    --danger:#B3261E;
    --danger-soft:#FBE3E1;
    --shadow:0 1px 2px rgba(19,42,70,.06), 0 6px 18px rgba(19,42,70,.07);
    --shadow-lg:0 8px 16px rgba(19,42,70,.07), 0 20px 46px rgba(19,42,70,.1);
    --glow-accent:0 10px 26px rgba(226,113,29,.32);
    --glow-primary:0 10px 26px rgba(28,114,147,.22);
    --grad-accent:linear-gradient(135deg,#E2711D,#F0934E);
    --grad-primary:linear-gradient(135deg,#1C7293,#0F4C5C);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B1826; --surface:#122238; --surface-2:#16304A; --border:#25456A;
      --text:#EAF1F7; --text-muted:#93A9C1; --primary:#59B6D6; --primary-strong:#8BD1E8;
      --primary-soft:#173947; --accent:#F0934E; --accent-soft:#3B2413;
      --success:#59C68A; --success-soft:#12331F; --warning:#E3A83B; --warning-soft:#3A2C0E; --danger:#F2A09A; --danger-soft:#3D1715;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
      --shadow-lg:0 10px 20px rgba(0,0,0,.35), 0 26px 54px rgba(0,0,0,.4);
      --glow-accent:0 10px 28px rgba(240,147,78,.28);
      --glow-primary:0 10px 28px rgba(89,182,214,.2);
      --grad-accent:linear-gradient(135deg,#F0934E,#E2711D);
      --grad-primary:linear-gradient(135deg,#59B6D6,#1C7293);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B1826; --surface:#122238; --surface-2:#16304A; --border:#25456A;
    --text:#EAF1F7; --text-muted:#93A9C1; --primary:#59B6D6; --primary-strong:#8BD1E8;
    --primary-soft:#173947; --accent:#F0934E; --accent-soft:#3B2413;
    --success:#59C68A; --success-soft:#12331F; --warning:#E3A83B; --warning-soft:#3A2C0E; --danger:#F2A09A; --danger-soft:#3D1715;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
    --shadow-lg:0 10px 20px rgba(0,0,0,.35), 0 26px 54px rgba(0,0,0,.4);
    --glow-accent:0 10px 28px rgba(240,147,78,.28);
    --glow-primary:0 10px 28px rgba(89,182,214,.2);
    --grad-accent:linear-gradient(135deg,#F0934E,#E2711D);
    --grad-primary:linear-gradient(135deg,#59B6D6,#1C7293);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:'Newsreader',Georgia,'Times New Roman',serif; text-wrap:balance; margin:0; }
  p{ margin:0; }
  button{ font-family:inherit; }
  ::selection{ background:var(--accent-soft); color:var(--text); }
  a{ color:var(--primary); }

  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  button, .btn{ cursor:pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:2px solid var(--primary); outline-offset:2px;
  }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
    font-size:.92rem; font-weight:600; padding:.62rem 1.1rem; border-radius:9px;
    border:1px solid transparent; transition:transform .15s ease, box-shadow .2s ease, background .15s ease, border-color .15s ease;
    white-space:nowrap;
  }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--grad-accent); color:#fff; box-shadow:var(--glow-accent); }
  .btn-primary:hover{ transform:translateY(-1px); box-shadow:0 14px 30px rgba(226,113,29,.4); }
  .btn-secondary{ background:var(--primary-soft); color:var(--primary-strong); }
  .btn-secondary:hover{ border-color:var(--primary); transform:translateY(-1px); }
  .btn-ghost{ background:transparent; color:var(--text-muted); border-color:var(--border); }
  .btn-ghost:hover{ color:var(--text); border-color:var(--primary); }
  .btn-sm{ padding:.42rem .78rem; font-size:.82rem; border-radius:7px; }
  .btn-sm:hover{ transform:none; }
  .btn:disabled{ opacity:.55; cursor:default; transform:none !important; box-shadow:none !important; }

  .icon{ width:1.15em; height:1.15em; flex:none; }

  /* ---------- Landing ---------- */
  .landing-page{ position:relative; overflow:hidden; }
  .landing-page::before{
    content:''; position:absolute; top:-220px; right:-160px; width:640px; height:640px; border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(226,113,29,.16), rgba(226,113,29,0) 68%); pointer-events:none;
  }
  .landing-page::after{
    content:''; position:absolute; top:280px; left:-220px; width:560px; height:560px; border-radius:50%;
    background:radial-gradient(circle at 60% 40%, rgba(28,114,147,.14), rgba(28,114,147,0) 68%); pointer-events:none;
  }
  .landing-top{
    position:relative; display:flex; align-items:center; justify-content:space-between;
    padding:1.1rem clamp(16px,4vw,3rem); border-bottom:1px solid var(--border);
  }
  .wordmark{ display:flex; align-items:center; gap:.6rem; font-weight:700; letter-spacing:.01em; }
  .wordmark .dot{
    width:11px; height:11px; border-radius:50%; background:var(--grad-accent);
    box-shadow:0 0 0 4px var(--accent-soft);
  }
  .wordmark span{ font-family:'Newsreader',serif; font-size:1.15rem; font-weight:600; }

  .hero{
    position:relative; max-width:1180px; margin:0 auto; padding:clamp(2.4rem,6vw,4.4rem) clamp(16px,4vw,3rem) 2rem;
    display:grid; grid-template-columns:1.05fr .95fr; gap:clamp(1.5rem,4vw,3rem); align-items:center;
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:.5rem; font-size:.74rem; font-weight:700;
    letter-spacing:.09em; text-transform:uppercase; color:var(--accent);
    background:var(--accent-soft); padding:.32rem .7rem; border-radius:100px; margin-bottom:1.4rem;
  }
  .hero h1{ font-size:clamp(2.2rem,4.6vw,3.6rem); font-weight:600; line-height:1.08; max-width:16ch; color:var(--text); }
  .hero h1 em{ font-style:italic; color:var(--primary); }
  .hero-sub{ max-width:52ch; font-size:1.08rem; line-height:1.6; color:var(--text-muted); margin-top:1.3rem; }
  .hero-actions{ display:flex; flex-wrap:wrap; gap:.9rem; margin-top:2rem; align-items:center; }
  .hero-note{ font-size:.85rem; color:var(--text-muted); }
  .hero-stats{ display:flex; flex-wrap:wrap; gap:clamp(1.4rem,4vw,2.4rem); margin-top:2.4rem; }
  .hero-stat b{ display:block; font-family:'Newsreader',serif; font-size:1.7rem; font-weight:600; color:var(--text); }
  .hero-stat span{ font-size:.78rem; color:var(--text-muted); }

  .hero-visual{
    position:relative; aspect-ratio:1/1; max-width:420px; margin:0 auto; justify-self:center;
  }
  .hero-visual svg{ width:100%; height:100%; }
  .hero-visual-card{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:.9rem 1.1rem;
    box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:.6rem; font-size:.82rem; font-weight:700;
    color:var(--text); white-space:nowrap;
  }
  .hero-visual-card .dot{ width:8px; height:8px; border-radius:50%; background:var(--success); flex:none; }

  .feature-strip{
    position:relative; max-width:1180px; margin:0 auto; padding:1rem clamp(16px,4vw,3rem) 4.5rem;
    display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:1.4rem;
  }
  .feature-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:1.5rem;
    box-shadow:var(--shadow); transition:transform .18s ease, box-shadow .18s ease; position:relative; overflow:hidden;
  }
  .feature-card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--card-accent, var(--grad-primary));
  }
  .feature-card:hover{ transform:translateY(-3px); box-shadow:var(--shadow-lg); }
  .feature-card .icon-badge{
    width:2.5rem; height:2.5rem; border-radius:10px; display:flex; align-items:center; justify-content:center;
    margin-bottom:1rem;
  }
  .feature-card h3{ font-size:1.08rem; font-weight:600; margin-bottom:.5rem; }
  .feature-card p{ font-size:.9rem; color:var(--text-muted); line-height:1.55; }

  .landing-footer{
    position:relative; max-width:1180px; margin:0 auto; padding:0 clamp(16px,4vw,3rem) 3rem; color:var(--text-muted); font-size:.82rem;
  }

  @media (max-width:960px){
    .hero{ grid-template-columns:1fr; }
    .hero-visual{ display:none; }
  }

  /* ---------- App shell ---------- */
  .shell{ display:flex; min-height:100%; }
  .rail{
    width:220px; flex:none; border-right:1px solid var(--border); background:var(--surface);
    display:flex; flex-direction:column; padding:1.1rem .9rem; gap:.2rem;
  }
  .rail-brand{ display:flex; align-items:center; gap:.5rem; padding:.4rem .5rem 1.1rem; }
  .rail-brand span{ font-family:'Newsreader',serif; font-weight:600; font-size:1.05rem; }
  .rail-link{
    display:flex; align-items:center; gap:.7rem; padding:.6rem .65rem; border-radius:9px;
    color:var(--text-muted); font-size:.9rem; font-weight:600; border:none; background:transparent;
    text-align:left; width:100%; position:relative; transition:background .15s ease, color .15s ease;
  }
  .rail-link:hover{ background:var(--surface-2); color:var(--text); }
  .rail-link.active{ background:var(--primary-soft); color:var(--primary-strong); }
  .rail-link.active::before{
    content:''; position:absolute; left:-.9rem; top:.35rem; bottom:.35rem; width:3px; border-radius:3px;
    background:var(--grad-accent);
  }
  .rail-foot{ margin-top:auto; padding:.7rem .5rem 0; border-top:1px solid var(--border); }
  .rail-foot a{ font-size:.78rem; color:var(--text-muted); text-decoration:none; }
  .rail-foot a:hover{ color:var(--primary); }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:1rem;
    padding:.85rem clamp(16px,3vw,2rem); border-bottom:1px solid var(--border); background:var(--surface);
    position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
  }
  .viewing-as{ display:flex; align-items:center; gap:.6rem; font-size:.86rem; color:var(--text-muted); }
  .org-switch{
    font-family:inherit; font-size:.86rem; font-weight:600; color:var(--text);
    background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:.4rem .6rem;
  }
  .content{ padding:clamp(16px,3vw,2rem); max-width:1080px; width:100%; margin:0 auto; }

  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:1rem; margin-bottom:1.4rem; flex-wrap:wrap; }
  .page-head h2{ font-size:1.6rem; font-weight:600; padding-left:.85rem; border-left:4px solid var(--accent); }
  .page-head p{ color:var(--text-muted); font-size:.92rem; margin-top:.3rem; padding-left:.85rem; }

  .toolbar{ display:flex; flex-wrap:wrap; gap:.6rem; margin-bottom:1.3rem; align-items:center; }
  .search-input{
    flex:1; min-width:180px; font-family:inherit; font-size:.9rem; padding:.6rem .8rem;
    border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text);
  }
  .chip{
    font-size:.8rem; font-weight:600; padding:.36rem .72rem; border-radius:100px;
    border:1px solid var(--border); background:var(--surface); color:var(--text-muted);
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .chip:hover{ border-color:var(--primary); color:var(--text); }
  .chip.active{ background:var(--grad-primary); color:#fff; border-color:transparent; box-shadow:var(--glow-primary); }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:1.1rem; }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:1.15rem;
    box-shadow:var(--shadow); transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .org-card:hover{ transform:translateY(-3px); box-shadow:var(--shadow-lg); border-color:var(--primary); }
  .org-card-top{ display:flex; justify-content:flex-end; margin-bottom:.4rem; }
  .org-badge{ font-size:.68rem; font-weight:700; letter-spacing:.03em; padding:.2rem .55rem; border-radius:100px; }
  .org-badge.real{ background:var(--surface-2); color:var(--text-muted); }
  .org-badge.demo{ background:var(--accent-soft); color:var(--accent); }
  .dir-footnote{ font-size:.8rem; color:var(--text-muted); margin-top:1.2rem; max-width:70ch; }
  .org-card h3{ font-size:1.05rem; font-weight:600; margin-bottom:.2rem; }
  .org-tagline{ font-size:.86rem; color:var(--text-muted); margin-bottom:.7rem; }
  .meta-row{ display:flex; flex-wrap:wrap; gap:.5rem; font-size:.78rem; color:var(--text-muted); margin-bottom:.8rem; }
  .meta-row span{ display:inline-flex; align-items:center; gap:.3rem; }
  .tag-row{ display:flex; flex-wrap:wrap; gap:.4rem; margin-bottom:1rem; }
  .tag{ font-size:.74rem; font-weight:600; padding:.24rem .58rem; border-radius:100px; background:var(--primary-soft); color:var(--primary-strong); }
  .tag.accent{ background:var(--accent-soft); color:var(--accent); }
  .card-actions{ display:flex; gap:.5rem; }

  .empty{ color:var(--text-muted); font-size:.9rem; padding:2rem 0; text-align:center; }

  .profile-head{ display:flex; justify-content:space-between; gap:1.2rem; flex-wrap:wrap; align-items:flex-start; margin-bottom:1.6rem; }
  .profile-head h2{ font-size:1.7rem; }
  .profile-grid{ display:grid; grid-template-columns:1.5fr 1fr; gap:1.4rem; }
  .section-label{ font-size:.76rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--text-muted); margin-bottom:.6rem; }
  .list-plain{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.5rem; }
  .list-plain li{ font-size:.9rem; padding:.55rem .7rem; background:var(--surface-2); border-radius:8px; }
  .side-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:1.1rem; margin-bottom:1rem; box-shadow:var(--shadow); }

  .request-composer{ margin-top:1rem; }
  textarea{
    width:100%; font-family:inherit; font-size:.9rem; padding:.7rem .8rem; border-radius:8px;
    border:1px solid var(--border); background:var(--surface); color:var(--text); resize:vertical; min-height:5rem;
  }

  .req-group{ margin-bottom:1.8rem; }
  .req-group-title{ font-size:.95rem; font-weight:700; margin-bottom:.7rem; display:flex; align-items:center; gap:.5rem; }
  .count-pill{ font-size:.72rem; font-weight:700; background:var(--surface-2); color:var(--text-muted); border-radius:100px; padding:.1rem .5rem; }
  .req-card{ display:flex; justify-content:space-between; gap:1rem; align-items:flex-start; flex-wrap:wrap; }
  .req-note{ font-size:.88rem; color:var(--text); line-height:1.5; margin-top:.35rem; max-width:52ch; }
  .req-date{ font-size:.76rem; color:var(--text-muted); margin-top:.4rem; }
  .status-pill{ font-size:.74rem; font-weight:700; padding:.22rem .6rem; border-radius:100px; white-space:nowrap; }
  .status-pending{ background:var(--warning-soft); color:var(--warning); }
  .status-accepted{ background:var(--success-soft); color:var(--success); }
  .status-declined{ background:var(--surface-2); color:var(--text-muted); }

  .thread{ margin-top:.9rem; border-top:1px solid var(--border); padding-top:.9rem; display:flex; flex-direction:column; gap:.6rem; }
  .msg{ max-width:80%; padding:.55rem .75rem; border-radius:10px; font-size:.87rem; line-height:1.45; }
  .msg-them{ background:var(--surface-2); align-self:flex-start; border-bottom-left-radius:3px; }
  .msg-me{ background:var(--primary-soft); color:var(--primary-strong); align-self:flex-end; border-bottom-right-radius:3px; }
  .msg-meta{ font-size:.72rem; color:var(--text-muted); margin-top:.15rem; }
  .msg-form{ display:flex; gap:.5rem; margin-top:.7rem; }
  .msg-form input{ flex:1; font-family:inherit; font-size:.87rem; padding:.55rem .7rem; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); }

  .res-card{ display:flex; flex-direction:column; gap:.55rem; }
  .res-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:.6rem; }
  .res-type{ font-size:.72rem; font-weight:700; padding:.2rem .55rem; border-radius:100px; white-space:nowrap; }
  .res-type.offer{ background:var(--success-soft); color:var(--success); }
  .res-type.need{ background:var(--accent-soft); color:var(--accent); }
  .res-org{ font-size:.8rem; color:var(--text-muted); }
  .res-detail{ font-size:.87rem; color:var(--text); line-height:1.5; }
  .res-date{ font-size:.75rem; color:var(--text-muted); }

  .bp-card{ display:flex; flex-direction:column; gap:.55rem; }
  .bp-summary{ font-size:.87rem; color:var(--text); line-height:1.5; }
  .bp-foot{ display:flex; justify-content:space-between; align-items:center; gap:.6rem; margin-top:.3rem; }
  .adopted-count{ font-size:.78rem; color:var(--text-muted); }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(11,24,38,.45); display:flex; align-items:flex-start;
    justify-content:center; padding:5vh 16px; z-index:50; overflow-y:auto;
  }
  .modal{
    background:var(--surface); border-radius:14px; padding:1.5rem; max-width:460px; width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.25); margin-bottom:5vh;
  }
  .modal h3{ font-size:1.15rem; margin-bottom:1rem; }
  .field{ margin-bottom:.9rem; }
  .field label{ display:block; font-size:.8rem; font-weight:600; color:var(--text-muted); margin-bottom:.35rem; }
  .field input, .field select, .field textarea{
    width:100%; font-family:inherit; font-size:.9rem; padding:.6rem .7rem; border-radius:8px;
    border:1px solid var(--border); background:var(--surface); color:var(--text);
  }
  .field-row{ display:flex; gap:.7rem; }
  .field-row .field{ flex:1; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:.6rem; margin-top:1.2rem; }

  .toast{
    position:fixed; bottom:1.2rem; left:50%; transform:translateX(-50%) translateY(10px); opacity:0;
    background:var(--text); color:var(--bg); padding:.65rem 1.1rem; border-radius:9px; font-size:.86rem;
    font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:80; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- Help board ---------- */
  .seg{ display:inline-flex; flex-wrap:wrap; gap:2px; padding:3px; margin-bottom:1.1rem; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; }
  .seg button{ border:none; background:transparent; font-size:.84rem; font-weight:600; color:var(--text-muted); padding:.42rem .85rem; border-radius:7px; display:inline-flex; align-items:center; gap:.4rem; }
  .seg button:hover{ color:var(--text); }
  .seg button.active{ background:var(--surface); color:var(--text); box-shadow:var(--shadow); }
  .toolbar-label{ font-size:.72rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--text-muted); margin-right:.15rem; }
  .filter-select{ font-family:inherit; font-size:.84rem; font-weight:600; padding:.42rem .6rem; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); max-width:100%; }
  .help-card{ display:flex; flex-direction:column; gap:.55rem; }
  .help-card:hover{ border-color:var(--primary); box-shadow:var(--shadow-lg); }
  .help-top{ display:flex; align-items:center; gap:.4rem; flex-wrap:wrap; }
  .help-top .res-date{ margin-left:auto; }
  .res-type.ask{ background:var(--accent-soft); color:var(--accent); }
  .urgent-pill{ font-size:.72rem; font-weight:700; padding:.2rem .55rem; border-radius:100px; background:var(--danger-soft); color:var(--danger); }
  .help-snippet{ font-size:.87rem; line-height:1.5; color:var(--text); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }

  /* ============ IMAGE EDITOR ============ */
  function cropSize(kind){ return kind==='avatar' ? [400, 400] : [1584, 396]; }
  function drawCrop(){
    var e = state.imageEdit, c = document.getElementById('crop-canvas');
    if(!e || !c) return;
    var ctx = c.getContext('2d'), W = c.width, H = c.height, iw = e.img.naturalWidth, ih = e.img.naturalHeight;
    var s = Math.max(W / iw, H / ih) * e.zoom, dw = iw * s, dh = ih * s;
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
    ctx.drawImage(e.img, (W - dw) * e.x, (H - dh) * e.y, dw, dh);
  }
  function renderImageModal(){
    var e = state.imageEdit, avatar = e.kind==='avatar', size = cropSize(e.kind), dis = state.busy ? ' disabled' : '';
    function slider(field, label, min, max, step){
      return '<div class="field"><label for="crop-' + field + '">' + label + '</label><input id="crop-' + field + '" type="range" min="' + min + '" max="' + max + '" step="' + step + '" value="' + e[field] + '" data-role="crop" data-field="' + field + '"></div>';
    }
    return '<div class="modal-backdrop" data-action="close-modal">'
      + '<div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="img-title">'
      +   '<h3 id="img-title">' + (avatar ? (isOrg() ? 'Logo / profile photo' : 'Profile photo') : 'Banner image') + '</h3>'
      +   '<p class="posting-as">' + (avatar ? 'Drag the sliders to frame your photo. ' : 'Wide images work best (at least 1584 × 396). ')
      +     (isOrg() ? 'Organization images are public.' : 'Visible to signed-in members.') + ' Hidden location data in photos is removed.</p>'
      +   (state.formError ? '<div class="form-error" role="alert">' + esc(state.formError) + '</div>' : '')
      +   '<div class="crop-frame ' + (avatar ? 'crop-avatar' : 'crop-banner') + '"><canvas id="crop-canvas" width="' + size[0] + '" height="' + size[1] + '" aria-label="Preview"></canvas></div>'
      +   slider('zoom', 'Zoom', 1, 3, 0.01)
      +   '<div class="field-row">' + slider('x', 'Left ↔ right', 0, 1, 0.01) + slider('y', 'Up ↕ down', 0, 1, 0.01) + '</div>'
      +   '<div class="modal-actions">'
      +     '<button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>'

      +   '</div>'
      + '</div></div>';
  }
  function loadPickedFile(file){
    if(!file) return;
    if(!/^image\//.test(file.type)){ toast('Please choose an image file.'); return; }
    if(file.size > 25 * 1024 * 1024){ toast('That image is over 25 MB. Please choose a smaller one.'); return; }
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        state.imageEdit = { kind:state.pickKind, img:img, zoom:1, x:0.5, y:0.5 };
        state.modal = 'image-edit'; state.formError = ''; render();
      };
      img.onerror = function(){ toast('That image format isn’t supported. Try a JPEG or PNG.'); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  function saveImage(){
    var e = state.imageEdit, c = document.getElementById('crop-canvas');
    if(!e || !c) return;
    // Re-encode as JPEG under the server's size limit (this also drops EXIF/GPS metadata).
    var limit = e.kind==='avatar' ? 280 * 1024 : 850 * 1024, q = 0.9, url;
    do { url = c.toDataURL('image/jpeg', q); q -= 0.1; } while(url.length * 0.75 > limit && q > 0.35);
    if(url.length * 0.75 > limit){ state.formError = 'That image is too detailed to save. Try zooming in or choosing another.'; render(); return; }
    state.formError = '';
    run(api('POST', 'me/media/' + e.kind, { dataUrl:url }).then(function(d){
      state.user = d.user; state.modal = null; state.imageEdit = null;
      toast(e.kind==='avatar' ? 'Profile photo updated.' : 'Banner updated.'); loadMemberOrgs();
    }), function(err){ state.formError = err.message; });
  }

  function renderHelpBoard(){
    var q = state.helpQuery.toLowerCase();
    var list = state.posts.filter(function(p){
      if(state.helpView!=='browse') return true;
      var hay = (p.title + ' ' + p.detail + ' ' + p.category + ' ' + p.location + ' ' + p.author.name).toLowerCase();
      var payKind = p.pay.kind==='stipend' ? 'paid' : p.pay.kind;
      return (!q || hay.indexOf(q)>-1)
        && (state.helpType==='all' || p.type===state.helpType)
        && (state.helpRegion==='All' || p.region===state.helpRegion)
        && (state.helpCat==='All' || p.category===state.helpCat)
        && (state.helpPay==='all' || payKind===state.helpPay);
    });

    var seg = !state.user ? '' : '<div class="seg" role="tablist">' + [
      {id:'browse', label:'Browse all'}, {id:'mine', label:'My posts'}, {id:'helping', label:'I’m helping'}
    ].map(function(s){
      return '<button role="tab" aria-selected="' + (state.helpView===s.id) + '" class="' + (state.helpView===s.id?'active':'') + '" data-action="set-help-view" data-view="' + s.id + '">' + s.label + '</button>';
    }).join('') + '</div>';

    function chips(field, options){
      return options.map(function(o){
        return '<button class="chip' + (state[field]===o[0]?' active':'') + '" data-action="set-filter" data-field="' + field + '" data-value="' + esc(o[0]) + '">' + esc(o[1]) + '</button>';
      }).join('');
    }
    var filters = state.helpView!=='browse' ? '' :
        '<div class="toolbar"><input class="search-input" type="text" placeholder="Search posts: groceries, water, tutoring, Nairobi…" value="' + esc(state.helpQuery) + '" data-search="helpQuery" aria-label="Search help posts">'
      +   '<select class="filter-select" data-role="help-cat" aria-label="Category"><option value="All">All categories</option>' + opts(Object.keys(HELP_CATS), state.helpCat) + '</select></div>'
      + '<div class="toolbar">' + chips('helpType', [['all','Asks & offers'],['ask','Asking for help'],['offer','Offering help']])
      +   '<span style="width:.6rem;"></span>' + chips('helpPay', [['all','Any'],['volunteer','Volunteer'],['paid','Paid & stipend'],['funding','Needs funding']]) + '</div>'
      + '<div class="toolbar"><span class="toolbar-label">Where</span>' + chips('helpRegion', [['All','Everywhere']].concat(REGIONS.map(function(r){ return [r, regionLabel(r)]; }))) + '</div>';

    var empty = state.postsLoading ? 'Loading posts…'
      : state.helpView==='mine' ? 'You haven’t posted anything yet. Ask for a hand, or offer one.'
      : state.helpView==='helping' ? 'You haven’t replied to any posts yet.'
      : state.posts.length ? 'Nothing matches those filters.'
      : 'No posts yet. Be the first to ask for help or offer it.';

    var sub = !state.user
      ? 'Here’s how people ask for help and offer it, from grocery runs down the street to clean water across the world. Try opening a post or writing one.'
      : isOrg()
      ? 'See what people and communities need, reply as your organization, or post paid roles and volunteer asks.'
      : 'Ask neighbors, volunteers, and organizations for a hand, or offer one. Posts range from grocery runs down the street to clean water across the world.';

    return '<div class="page-head">'
      +   '<div><h2>Help Board</h2><p>' + sub + '</p></div>'
      +   '<button class="btn btn-primary" data-action="open-modal" data-modal="post-help">+ Post to the Help Board</button>'
      + '</div>'
      + seg + filters
      + (list.length && !state.postsLoading ? '<div class="grid">' + list.map(helpCard).join('') + '</div>' : '<div class="empty">' + empty + '</div>');
  }

  function renderThread(p, r){
    var msgs = [{ text:r.text, createdAt:r.createdAt, isMine:r.isMine, from:r.user.name }].concat(r.messages);
    return '<div class="thread">' + msgs.map(function(m){
        return '<div class="msg ' + (m.isMine?'msg-me':'msg-them') + '">' + esc(m.text) + '<div class="msg-meta">' + (m.isMine ? 'You' : esc(m.from)) + ' · ' + fmtDate(m.createdAt) + '</div></div>';
      }).join('')
      + (p.status==='resolved' ? '' :
        '<form class="msg-form" data-action="send-message" data-reply="' + esc(r.id) + '">'
        + '<input type="text" maxlength="2000" placeholder="Write a message…" aria-label="Message" required>'
        + '<button class="btn btn-primary btn-sm" type="submit"' + (state.busy?' disabled':'') + '>Send</button></form>')
      + '</div>';
  }
  function replyStatus(r){
    if(r.status==='accepted') return '<span class="status-pill status-accepted">Accepted</span>';
    if(r.status==='declined') return '<span class="status-pill status-declined">Declined</span>';
    return '<span class="status-pill status-pending">Awaiting reply</span>';
  }

  function renderHelpDetail(){
    var back = '<button class="btn btn-ghost btn-sm" style="margin-bottom:1rem;" data-action="close-help">← Back to Help Board</button>';
    var p = state.helpDetail;
    if(!p) return back + '<div class="empty">Loading…</div>';
    var dis = state.busy ? ' disabled' : '';

    var ownerActions = p.isMine
      ? '<div class="card-actions">'
        + (p.status!=='resolved'
            ? '<button class="btn btn-secondary btn-sm" data-action="set-post-status" data-status="resolved"' + dis + '>Mark as resolved</button>'
            : '<button class="btn btn-secondary btn-sm" data-action="set-post-status" data-status="open"' + dis + '>Reopen</button>')
        + '<button class="btn btn-ghost btn-sm" data-action="delete-post"' + dis + '>Delete</button></div>'
      : '';

    var head = back
      + '<div class="profile-head">'
      +   '<div><div class="help-top" style="margin-bottom:.6rem;">' + typePill(p) + (p.urgency==='Urgent' ? '<span class="urgent-pill">Urgent</span>' : '') + statusPill(p) + '</div>'
      +   '<h2>' + esc(p.title) + '</h2></div>' + ownerActions
      + '</div>'
      + '<div class="meta-row" style="margin-bottom:.8rem;"><span>' + ICONS.pin + esc(p.location) + '</span><span>' + ICONS.globe + esc(scaleLabel(p.scale)) + '</span><span>Posted ' + fmtDate(p.createdAt) + '</span></div>'
      + '<div class="tag-row"><span class="tag">' + esc(p.category) + '</span>' + payTag(p.pay) + '<span class="tag muted">' + esc(p.urgency) + '</span></div>'
      + (p.hidden ? '<div class="form-error">Moderators hid this post after a report, so other members can’t see it. If you think this is a mistake, email ' + esc(contactEmail()) + '.</div>' : '');

    var replies;
    var mine = p.replies.filter(function(r){ return r.isMine; })[0];
    if(p.isMine){
      replies = '<div class="section-label" style="margin-top:.4rem;">Replies (' + p.replies.length + ')</div>'
        + (p.replies.length ? p.replies.map(function(r){
            var open = state.openThread===r.id;
            var btns = (r.status==='pending' && p.status!=='resolved')
              ? '<button class="btn btn-primary btn-sm" data-action="respond-reply" data-reply="' + esc(r.id) + '" data-status="accepted"' + dis + '>Accept</button>'
                + '<button class="btn btn-ghost btn-sm" data-action="respond-reply" data-reply="' + esc(r.id) + '" data-status="declined"' + dis + '>Decline</button>'
              : '';
            return '<div class="card response">'
              + '<div class="response-head"><div class="author-line">' + avatarHtml(r.user, 'sm') + '<div><h3 style="font-size:.98rem;">' + nameLink(r.user) + '</h3><div class="res-org">' + esc(r.user.headline ? r.user.headline + ' · ' : '') + esc(r.user.location) + '</div></div></div>' + replyStatus(r) + '</div>'
              + (open ? renderThread(p, r) : '<div class="req-note">' + esc(r.text) + '</div>')
              + '<div class="card-actions" style="margin-top:.7rem;">' + btns
              +   '<button class="btn btn-secondary btn-sm" data-action="toggle-thread" data-reply="' + esc(r.id) + '">' + (open ? 'Hide messages' : 'Messages (' + (r.messages.length + 1) + ')') + '</button></div>'
              + safetyRow({ reportType:'reply', reportId:r.id, label:'reply from ' + r.user.name, blockId:r.user.id, blockName:r.user.name })
              + '</div>';
          }).join('') : '<div class="card empty" style="padding:1.4rem;">No replies yet. The organizations on the right work on this kind of need, so you can also contact them directly.</div>');
    } else if(mine){
      replies = '<div class="card response"><div class="response-head"><div class="section-label" style="margin:0;">Your reply</div>' + replyStatus(mine) + '</div>' + renderThread(p, mine)
        + safetyRow({ reportType:'reply', reportId:mine.id, label:'conversation with ' + p.author.name }) + '</div>';
    } else if(p.status==='resolved'){
      replies = '<div class="card empty" style="padding:1.4rem;">This post has been resolved.</div>';
    } else {
      replies = '<form class="card request-composer" data-action="send-reply">'
        + '<label class="section-label" for="help-reply-text">' + (p.type==='ask' ? 'Offer to help' : 'Request this help') + '</label>'
        + '<textarea id="help-reply-text" maxlength="2000" required placeholder="' + (p.type==='ask' ? 'Say how you can help and when you’re available…' : 'Say what you need and when…') + '"></textarea>'
        + '<div class="card-actions" style="margin-top:.7rem;"><button class="btn btn-primary btn-sm" type="submit"' + dis + '>Send reply</button></div>'
        + '<p class="posting-as" style="margin:.7rem 0 0;">' + (state.user ? 'Only ' + esc(p.author.name) + ' will see your reply. Don’t share your address or financial details until you trust the other person.' : 'You’re a guest, so you’ll be asked to create a free account before a reply is sent.') + '</p>'
        + '</form>';
    }

    var suggestions = suggestOrgs(p);
    var side = '<div class="side-card"><div class="section-label">Posted by</div>'
      +   '<div class="author-line">' + avatarHtml(p.author, 'md') + '<div><p style="font-size:.92rem; font-weight:600;">' + nameLink(p.author) + '</p>'
      +   (p.author.headline ? '<p class="res-org" style="margin-top:.1rem;">' + esc(p.author.headline) + '</p>' : '') + '</div></div>'
      +   (p.sample ? '<p class="hint" style="margin-top:.7rem;">This is a sample post for guests to explore. The people in it are fictional.</p>' : '')
      +   (p.author.id && !p.isMine ? '<button class="btn btn-ghost btn-sm" style="margin-top:.7rem;" data-action="view-member" data-user="' + esc(p.author.id) + '">View profile</button>' : '')
      +   (p.isMine || !state.user ? '' : safetyRow({ reportType:'post', reportId:p.id, label:'post “' + p.title + '”', blockId:p.author.id, blockName:p.author.name }))
      + '</div>'
      + '<div class="side-card"><div class="section-label">Organizations working on this</div>'
      +   (suggestions.length ? '<div class="suggest">' + suggestions.map(function(o){
            return '<button class="suggest-item suggest-org" data-action="view-org" data-org="' + esc(o.id) + '">'
              + avatarHtml({ id:o.userId || o.id, name:o.name, avatarUrl:o.avatarUrl, accountType:'org', isLogo:o.kind==='real', logoDark:o.logoDark }, 'sm')
              + '<span>' + esc(o.name) + '<small>' + (o.kind==='member' ? 'Member org' : 'Reference directory') + ' · ' + esc(regionLabel(regionOf(o))) + '</small></span></button>';
          }).join('') + '</div>' : '<p class="res-org">No close matches in the directory yet.</p>')
      +   '<p class="res-org" style="margin-top:.7rem; font-size:.74rem;">Matched by cause area and region. Organizations in the reference directory aren’t notified about posts.</p>'
      + '</div>';

    return head
      + '<div class="profile-grid">'
      +   '<div><div class="card" style="margin-bottom:1rem;"><div class="section-label">Details</div><p style="font-size:.94rem; line-height:1.6; white-space:pre-wrap;">' + esc(p.detail) + '</p></div>' + replies + '</div>'
      +   '<div>' + side + '</div>'
      + '</div>';
  }

  /* ============ RENDER: DIRECTORY ============ */
  function renderDirectory(){
    var q = state.dirQuery.toLowerCase();
    var list = allOrgs().filter(function(o){
      if(o.userId && state.user && o.userId===state.user.id) return false;
      var hay = (o.name + ' ' + o.tagline + ' ' + o.location + ' ' + (o.mission||'') + ' ' + o.causes.join(' ')).toLowerCase();
      return (!q || hay.indexOf(q)>-1)
        && (state.dirCause==='All' || o.causes.indexOf(state.dirCause) > -1)
        && (state.dirSource==='all' || (state.dirSource==='member' ? o.kind==='member' : o.kind==='real'))
        && (state.dirRegion==='All' || regionOf(o)===state.dirRegion);
    });
    function chips(field, action, attr, options){
      return options.map(function(o){
        return '<button class="chip' + (state[field]===o[0]?' active':'') + '" data-action="' + action + '" data-' + attr + '="' + esc(o[0]) + '">' + esc(o[1]) + '</button>';
      }).join('');
    }
    var cards = list.map(function(o){
      var badge = o.kind!=='member' ? '<span class="org-badge real">Reference directory</span>'
        : o.verified ? verifiedMark() : '<span class="org-badge demo">Member · self-described</span>';
      return '<div class="card org-card">'
        + '<div class="org-card-top">' + avatarHtml({ id:o.userId || o.id, name:o.name, avatarUrl:o.avatarUrl, accountType:'org', isLogo:o.kind==='real', logoDark:o.logoDark }, 'md') + badge + '</div>'
        + '<h3>' + esc(o.name) + '</h3>'
        + '<div class="org-tagline">' + esc(o.tagline) + '</div>'
        + '<div class="meta-row"><span>' + ICONS.pin + esc(o.location) + '</span>' + (regionOf(o)==='Global' ? '<span>' + ICONS.globe + 'Works globally</span>' : '') + '</div>'
        + '<div class="tag-row">' + o.causes.map(function(c){ return '<span class="tag">' + esc(c) + '</span>'; }).join('') + '</div>'
        + '<div class="card-actions"><button class="btn btn-secondary btn-sm" data-action="view-org" data-org="' + esc(o.id) + '">View profile</button></div>'
        + '</div>';
    }).join('');
    var head = isOrg()
      ? '<h2>Nonprofit &amp; NGO directory</h2><p>Member organizations on Global Neighbors, plus a reference directory of nonprofits and NGOs in Greater Boston, the U.S., and around the world.</p>'
      : '<h2>Find support</h2><p>Nonprofits, NGOs, and community groups in Greater Boston and around the world. Filter by where you are and what you need.</p>';
    return '<div class="page-head"><div>' + head + '</div><div class="hero-note">' + list.length + ' shown</div></div>'
      + '<div class="toolbar"><input class="search-input" type="text" placeholder="Search by name, cause, city, or country…" value="' + esc(state.dirQuery) + '" data-search="dirQuery" aria-label="Search organizations"></div>'
      + '<div class="toolbar"><span class="toolbar-label">Where</span>' + chips('dirRegion', 'set-dir', 'region', [['All','Everywhere']].concat(REGIONS.map(function(r){ return [r, regionLabel(r)]; }))) + '</div>'
      + '<div class="toolbar"><span class="toolbar-label">Source</span>' + chips('dirSource', 'set-dir', 'source', [['all','All'],['member','Member organizations'],['real','Reference directory']]) + '</div>'
      + '<div class="toolbar"><span class="toolbar-label">Cause</span>' + chips('dirCause', 'set-dir', 'cause', [['All','All']].concat(allCauses().map(function(c){ return [c,c]; }))) + '</div>'
      + (list.length ? '<div class="grid">' + cards + '</div>' : '<div class="empty">No organizations match that search yet.</div>')
      + '<div class="dir-footnote">Reference-directory entries show each organization’s public mission and a link to its official site; those organizations are not affiliated with Global Neighbors. Member organizations wrote their own profiles. A ✓ Verified badge means Global Neighbors has checked the organization’s registration details.</div>';
  }

  // Reference-directory organizations (member organizations use renderMemberProfile).

    var o = orgById(id);
    var back = '<button class="btn btn-ghost btn-sm" style="margin-bottom:1rem;" data-action="close-org">← Back to ' + (isOrg() ? 'directory' : 'Find support') + '</button>';

    var hero = '<section class="card profile-hero">'
      + '<div class="profile-banner has-image" style="background-image:url(' + esc(o.bannerUrl) + ')"></div>'
      + '<div class="profile-hero-body"><div class="avatar-wrap">' + avatarHtml({ id:o.id, name:o.name, accountType:'org', avatarUrl:o.avatarUrl, isLogo:true, logoDark:o.logoDark }, 'xl') + '</div>'
      +   '<div class="profile-hero-actions"><a class="btn btn-secondary btn-sm" href="' + esc(o.website) + '" target="_blank" rel="noopener noreferrer">Visit website</a></div>'
      +   '<h2 class="profile-name">' + esc(o.name) + '</h2><p class="profile-headline">' + esc(o.tagline) + '</p>'
      +   '<div class="meta-row" style="margin:.55rem 0 0;"><span>' + ICONS.pin + esc(o.location) + '</span><span>' + ICONS.globe + esc(regionLabel(regionOf(o))) + '</span><span>Reference directory</span></div>'
      + '</div></section>';
    return back + hero
      + '<div class="profile-grid"><div>'
      +   '<div class="card" style="margin-bottom:1rem;"><div class="section-label">Mission</div><p style="font-size:.94rem; line-height:1.6;">' + esc(o.mission) + '</p></div>'
      + '</div><div>'
      +   '<div class="side-card"><div class="section-label">Cause areas</div>' + chipList(o.causes) + '</div>'
      +   '<div class="side-card"><div class="section-label">Reference directory</div><p style="font-size:.88rem; line-height:1.55; color:var(--text-muted);">Listed from public information. This organization is not affiliated with Global Neighbors and doesn’t receive posts or messages here. Contact them through their website.</p>'
      +     '<p class="hint" style="margin-top:.6rem;">' + (o.avatarUrl ? 'Logo is the organization’s own, shown to identify it. ' : '') + 'Banner is an illustrative photo of this kind of work, not of the organization. <a href="/credits">Photo credits</a></p></div>'
      + '</div></div>';
  }

          }).join('')

      : '';

      +   '<div class="field"><label for="pf-headline">' + (org ? 'Tagline' : 'Headline') + '</label><input id="pf-headline" maxlength="120" value="' + esc(u.headline) + '" placeholder="' + (org ? 'e.g. Mobile food pantry & community kitchen' : 'e.g. Retired teacher, weekend volunteer') + '"></div>'
      +   '<div class="field-row">'
      +     '<div class="field"><label for="pf-loc">Location</label><input id="pf-loc" maxlength="100" required value="' + esc(u.location) + '"></div>'
      +     '<div class="field"><label for="pf-region">Region</label><select id="pf-region">' + opts(REGIONS, u.region, regionLabel) + '</select></div>'
      +   '</div>'
      +   '<div class="field"><label for="pf-bio">' + (org ? 'Mission' : 'About you (optional)') + '</label><textarea id="pf-bio" maxlength="2000">' + esc(u.bio) + '</textarea></div>'

  function renderVerificationCard(){
    var u = state.user, v = state.myVerification, dis = state.busy ? ' disabled' : '';
    var head = '<div class="section-label">Verification</div>';
    if(v===undefined) return '<div class="card" style="margin-bottom:1rem;">' + head + '<p class="res-org">Loading…</p></div>';
    if(u.verificationStatus==='verified'){

  function loadAdmin(){

    else if(state.adminView==='verifications'){ a.verifications = null; api('GET', 'admin/verifications').then(done('verifications'), fail('verifications')); }
    else { a.users = null; api('GET', 'admin/users?q=' + encodeURIComponent(a.userQuery)).then(done('users'), fail('users')); }

  // Links from emails arrive as #/verify/<token> or #/reset/<token>; the fragment never reaches server logs.
  function handleHashLink(){
    var m = location.hash.match(/^#\/(verify|reset)\/([A-Za-z0-9_-]{20,100})$/);
    if(!m) return false;
    history.replaceState(null, '', location.pathname + location.search);
    if(m[1]==='reset'){
      state.view='auth'; state.authMode='reset'; state.resetToken=m[2]; state.formError=''; state.authNotice='';
      render(); return true;
    }
    api('POST', 'auth/verify', { token:m[2] }).then(function(d){
      if(d.user) state.user = d.user;
      toast('Email confirmed. Thank you!'); render();
    }, function(err){ toast(err.message); });
    return false;
  }

  /* ============ RENDER DISPATCH ============ */
  function render(){
    var root = document.getElementById('root');
    if(state.booting){ root.innerHTML = '<div class="empty" style="padding-top:30vh;">Loading…</div>'; return; }
    // Keep typed-but-unsent text across re-renders.
    var keep = {};
    document.querySelectorAll('#root input[id], #root textarea[id], #root select[id]').forEach(function(el){
      if(el.type!=='password' && el.type!=='radio' && el.type!=='checkbox') keep[el.id] = el.value;
    });
    root.innerHTML = state.view==='landing' ? renderLanding() : state.view==='auth' ? renderAuth() : renderApp();
    Object.keys(keep).forEach(function(id){
      var el = document.getElementById(id);
      if(el && el.getAttribute('data-search')===null && el.type!=='range') el.value = keep[id];
    });
    if(state.modal==='image-edit') drawCrop();
  }

  /* ============ EVENTS ============ */
  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el || el.tagName==='FORM') return;
    var action = el.getAttribute('data-action');

    if(action==='show-auth'){
      state.view='auth'; state.authMode = el.getAttribute('data-mode') || 'signup';
      if(el.getAttribute('data-type')) state.signupType = el.getAttribute('data-type');
      state.formError=''; render(); window.scrollTo(0,0); return;
    }
    if(action==='auth-mode'){ state.authMode = el.getAttribute('data-mode'); state.formError=''; state.authNotice=''; render(); return; }
    if(action==='to-landing'){ state.view='landing'; state.formError=''; render(); return; }
    if(action==='enter-guest'){ enterGuest(); return; }
    if(action==='view-member'){ state.modal=null; openMember(el.getAttribute('data-user')); return; }
    if(action==='member-back'){ state.tab = state.memberReturnTab; state.memberProfile=null; render(); return; }
    if(action==='pick-image'){
      state.pickKind = el.getAttribute('data-kind');
      var picker = document.getElementById('file-pick'); picker.value = ''; picker.click();
      return;
    }
    if(action==='save-image'){ saveImage(); return; }
    if(action==='remove-media'){
      var mk = el.getAttribute('data-kind');
      if(!window.confirm(mk==='avatar' ? 'Remove your profile photo?' : 'Remove your banner image?')) return;
      run(api('DELETE', 'me/media/' + mk).then(function(d){ state.user = d.user; toast('Removed.'); loadMemberOrgs(); }));
      return;
    }
    if(action==='set-preset'){
      run(api('PATCH', 'me', { bannerPreset:el.getAttribute('data-preset') }).then(function(d){ state.user = d.user; }));
      return;
    }
    if(action==='logout'){
      try{ sessionStorage.removeItem('gn_guest'); }catch(err){}
      run(api('POST', 'auth/logout').then(function(){
        state.user=null; state.view='landing'; state.posts=[]; state.helpDetail=null; state.selectedHelpId=null;
        toast('You’re logged out.');
      }));
      return;
    }
    if(action==='set-tab'){
      state.tab = el.getAttribute('data-tab'); state.selectedOrgId=null; state.selectedHelpId=null; state.helpDetail=null;
      render(); if(state.tab==='help') loadPosts(); if(state.tab==='directory') loadMemberOrgs();
      if(state.tab==='profile') loadProfileExtras(); if(state.tab==='admin') loadAdmin(); return;
    }
    if(action==='set-help-view'){ state.helpView = el.getAttribute('data-view'); state.posts=[]; render(); loadPosts(); return; }
    if(action==='set-filter'){ state[el.getAttribute('data-field')] = el.getAttribute('data-value'); render(); return; }
    if(action==='set-dir'){
      if(el.hasAttribute('data-region')) state.dirRegion = el.getAttribute('data-region');
      if(el.hasAttribute('data-source')) state.dirSource = el.getAttribute('data-source');
      if(el.hasAttribute('data-cause')) state.dirCause = el.getAttribute('data-cause');
      render(); return;
    }
    if(action==='view-help'){ openHelp(el.getAttribute('data-id')); return; }
    if(action==='close-help'){ state.selectedHelpId=null; state.helpDetail=null; render(); loadPosts(); return; }
    if(action==='toggle-thread'){ var rid = el.getAttribute('data-reply'); state.openThread = state.openThread===rid ? null : rid; render(); return; }
    if(action==='respond-reply'){
      var st = el.getAttribute('data-status'), replyId = el.getAttribute('data-reply');
      run(api('PATCH', 'replies/' + replyId, { status:st }).then(function(d){
        state.helpDetail = d.post; if(st==='accepted') state.openThread = replyId;
        toast(st==='accepted' ? 'Accepted. Say hello and sort out the details.' : 'Reply declined.');
      }));
      return;
    }
    if(action==='set-post-status'){
      var ns = el.getAttribute('data-status');
      run(api('PATCH', 'help/' + state.helpDetail.id, { status:ns }).then(function(){
        toast(ns==='resolved' ? 'Marked as resolved. Thanks for closing the loop!' : 'Post reopened.');
        return openHelp(state.helpDetail.id);
      }));
      return;
    }
    if(action==='delete-post'){
      if(!window.confirm('Delete this post and all its replies? This can’t be undone.')) return;
      run(api('DELETE', 'help/' + state.helpDetail.id).then(function(){
        state.selectedHelpId=null; state.helpDetail=null; toast('Post deleted.'); loadPosts();
      }));
      return;
    }
    if(action==='view-org'){
      var oid = el.getAttribute('data-org');
      if(oid.indexOf('member:')===0){ openMember(oid.slice(7)); return; }
      state.tab='directory'; state.selectedOrgId = oid; state.selectedHelpId=null; state.memberProfile=null;
      render(); window.scrollTo(0,0);
      if(oid.indexOf('member:')===0){
        api('GET', 'users/' + oid.slice(7)).then(function(d){ state.memberProfile = d; render(); }, function(err){ toast(err.message); });
      }
      return;
    }
    if(action==='close-org'){ state.selectedOrgId=null; render(); return; }
    if(action==='open-report'){
      state.report = { type:el.getAttribute('data-type'), id:el.getAttribute('data-id'), label:el.getAttribute('data-label') };
      state.modal='report'; state.formError=''; render(); return;
    }
    if(action==='block-user'){
      var bid = el.getAttribute('data-user'), bname = el.getAttribute('data-name');
      if(!window.confirm('Block ' + bname + '? You won’t see each other’s posts, replies, or messages. You can unblock them later from My profile.')) return;
      run(api('POST', 'blocks', { userId:bid }).then(function(){
        toast('Blocked ' + bname + '.');
        if(state.selectedOrgId){ state.selectedOrgId=null; }
        if(state.selectedHelpId){
          if(state.helpDetail && state.helpDetail.author.id===bid){ state.selectedHelpId=null; state.helpDetail=null; loadPosts(); }
          else openHelp(state.selectedHelpId);
        }
      }));
      return;
    }
    if(action==='unblock'){
      run(api('DELETE', 'blocks/' + encodeURIComponent(el.getAttribute('data-user'))).then(function(){ toast('Unblocked.'); loadProfileExtras(); }));
      return;
    }
    if(action==='resend-verify'){
      run(api('POST', 'auth/verify/send').then(function(d){
        toast(d.alreadyVerified ? 'Your email is already confirmed.' : 'Sent! Check your inbox (and spam folder).');
      }));
      return;
    }
    if(action==='admin-view'){ state.adminView = el.getAttribute('data-view'); state.admin.resetLink=null; loadAdmin(); return; }
    if(action==='admin-report-filter'){ state.admin.reportFilter = el.getAttribute('data-value'); loadAdmin(); return; }
    if(action==='admin-report'){
      var rid2 = el.getAttribute('data-id'), act = el.getAttribute('data-act');
      if(act.indexOf('suspend')>-1 && !window.confirm('Suspend this member? They’ll be signed out immediately and won’t be able to log in.')) return;
      run(api('POST', 'admin/reports/' + rid2, { action:act, note:val('an-' + rid2) }).then(function(){ toast('Report resolved.'); loadAdmin(); }));
      return;
    }
    if(action==='admin-unhide'){
      run(api('POST', 'admin/posts/' + el.getAttribute('data-id'), { action:'unhide' }).then(function(){ toast('Post is visible again.'); loadAdmin(); }));
      return;
    }
    if(action==='admin-verify'){
      var vid = el.getAttribute('data-id'), dec = el.getAttribute('data-decision');
      run(api('POST', 'admin/verifications/' + vid, { decision:dec, note:val('av-' + vid) }).then(function(){
        toast(dec==='approve' ? 'Organization verified.' : 'Request rejected.'); loadAdmin(); loadMemberOrgs();
      }));
      return;
    }
    if(action==='admin-user'){
      var uid = el.getAttribute('data-id'), uact = el.getAttribute('data-act'), uname = el.getAttribute('data-name');
      if(uact==='suspend' && !window.confirm('Suspend this member? They’ll be signed out immediately and won’t be able to log in.')) return;
      run(api('POST', 'admin/users/' + uid, { action:uact }).then(function(d){
        if(uact==='reset-link'){ state.admin.resetLink = { name:uname, link:d.link }; toast('Reset link created.'); render(); }
        else { toast(uact==='suspend' ? 'Member suspended.' : uact==='unsuspend' ? 'Member unsuspended.' : 'Image removed.'); loadAdmin(); }
      }));
      return;
    }
    if(action==='copy-reset'){
      var out = document.getElementById('reset-link-out');
      (navigator.clipboard ? navigator.clipboard.writeText(out.value) : Promise.reject()).then(function(){ toast('Copied.'); }, function(){ out.select(); toast('Press Ctrl/⌘+C to copy.'); });
      return;
    }
    if(action==='open-modal'){ state.modal = el.getAttribute('data-modal'); state.formError=''; render(); var t = document.getElementById('hp-title'); if(t) t.focus(); return; }
    if(action==='close-modal'){ if(el.classList.contains('modal-backdrop') && e.target!==el) return; state.modal=null; state.imageEdit=null; state.formError=''; render(); return; }
  });

  document.addEventListener('input', function(e){
    if(e.target.getAttribute('data-role')==='crop' && state.imageEdit){
      state.imageEdit[e.target.getAttribute('data-field')] = parseFloat(e.target.value); drawCrop(); return;
    }
    var field = e.target.getAttribute('data-search');
    if(field){
      state[field] = e.target.value;
      var caret = e.target.selectionStart;
      render();
      var again = document.querySelector('[data-search="' + field + '"]');
      if(again){ again.focus(); try{ again.setSelectionRange(caret, caret); }catch(err){} }
    }
  });

  document.addEventListener('change', function(e){
    if(e.target.id==='file-pick'){ loadPickedFile(e.target.files && e.target.files[0]); return; }
    var role = e.target.getAttribute('data-role');
    if(role==='signup-type'){ state.signupType = e.target.value; render(); }
    if(role==='help-cat'){ state.helpCat = e.target.value; render(); }
    if(role==='agree-terms'){ state.agreeTerms = e.target.checked; }
  });

  document.addEventListener('submit', function(e){
    var form = e.target;
    var action = form.getAttribute('data-action');
    if(!action) return;
    e.preventDefault();
    if(state.busy) return;
    function formError(err){ state.formError = err.message; }

    if(action==='signup'){
      state.formError='';
      run(api('POST', 'auth/signup', {
        accountType:state.signupType, displayName:val('su-name'), email:val('su-email'),
        password:document.getElementById('su-pass').value, location:val('su-loc'), region:val('su-region'), acceptTerms:state.agreeTerms
      }).then(function(d){
        enterApp(d.user);
        toast(d.verificationSent ? 'Welcome! Check your email to confirm your address.'
          : d.user.accountType==='org' ? 'Welcome! Add your mission and cause areas under My profile.' : 'Welcome to Global Neighbors!');
      }), formError);
      return;
    }
    if(action==='login'){
      state.formError='';
      run(api('POST', 'auth/login', { email:val('li-email'), password:document.getElementById('li-pass').value })
        .then(function(d){ enterApp(d.user); }), formError);
      return;
    }
    if(action==='forgot'){
      state.formError=''; state.authNotice='';
      run(api('POST', 'auth/forgot', { email:val('fp-email') }).then(function(){
        state.authNotice = 'If that email matches an account, a reset link is on its way. It expires in 1 hour, so check your spam folder too.';
      }), formError);
      return;
    }
    if(action==='reset'){
      state.formError='';
      var np = document.getElementById('rp-pass').value;
      if(np !== document.getElementById('rp-pass2').value){ state.formError = 'Those passwords don’t match.'; render(); return; }
      run(api('POST', 'auth/reset', { token:state.resetToken, password:np }).then(function(d){
        state.resetToken=null; enterApp(d.user); toast('Password updated. You’re logged in.');
      }), formError);
      return;
    }
    if(action==='submit-report'){
      state.formError='';
      run(api('POST', 'reports', { targetType:state.report.type, targetId:state.report.id, reason:val('rpt-reason'), details:val('rpt-details') }).then(function(){
        state.modal=null; state.report=null; toast('Thank you. A moderator will review this report.');
      }), formError);
      return;
    }
    if(action==='request-verification'){
      run(api('POST', 'me/verification', {
        legalName:val('vf-legal'), registrationNumber:val('vf-reg'), country:val('vf-country'),
        website:val('vf-web'), contactRole:val('vf-role'), notes:val('vf-notes')
      }).then(function(d){ state.myVerification = d.verification; state.user.verificationStatus = 'pending'; toast('Verification request sent.'); }));
      return;
    }
    if(action==='admin-search'){ state.admin.userQuery = val('au-q'); state.admin.resetLink=null; loadAdmin(); return; }
    if(action==='submit-help' && !state.user){
      state.pendingDraft = {};
      ['hp-type','hp-cat','hp-title','hp-detail','hp-loc','hp-region','hp-scale','hp-urgency','hp-pay','hp-paylabel'].forEach(function(id){ state.pendingDraft[id] = document.getElementById(id).value; });
      state.gateReason = 'post'; state.modal = 'gate'; render(); return;
    }
    if(action==='send-reply' && !state.user){ state.gateReason = 'reply'; state.modal = 'gate'; render(); return; }
    if(action==='submit-help'){
      state.formError='';
      run(api('POST', 'help', {
        type:val('hp-type'), category:val('hp-cat'), title:val('hp-title'), detail:val('hp-detail'),
        location:val('hp-loc'), region:val('hp-region'), scale:val('hp-scale'), urgency:val('hp-urgency'),
        payKind:val('hp-pay'), payLabel:val('hp-paylabel')
      }).then(function(){
        state.modal=null; state.tab='help'; state.helpView='mine'; state.selectedHelpId=null;
        toast('Posted to the Help Board.'); loadPosts();
      }), formError);
      return;
    }
    if(action==='send-reply'){
      var id = state.helpDetail.id;
      run(api('POST', 'help/' + id + '/replies', { text:val('help-reply-text') }).then(function(d){
        state.helpDetail = d.post; toast('Reply sent to ' + d.post.author.name + '.');
      }));
      return;
    }
    if(action==='send-message'){
      var input = form.querySelector('input');
      var textVal = input.value.trim();
      if(!textVal) return;
      var replyId = form.getAttribute('data-reply');
      run(api('POST', 'replies/' + replyId + '/messages', { text:textVal }).then(function(d){
        state.helpDetail = d.post; state.openThread = replyId;
      })).then(function(){
        var next = document.querySelector('form[data-action="send-message"] input');
        if(next){ next.value=''; next.focus(); }
      });
      return;
    }
    if(action==='save-profile'){
      var splitTags = function(v){ return v.split(',').map(function(x){ return x.trim(); }).filter(Boolean); };
      var body = { displayName:val('pf-name'), headline:val('pf-headline'), location:val('pf-loc'), region:val('pf-region'), bio:val('pf-bio'),
        skills:splitTags(val('pf-skills')), languages:splitTags(val('pf-langs')) };
      if(!isOrg()) body.pronouns = val('pf-pronouns');
      if(isOrg()){
        body.website = val('pf-web');
        body.causes = [].slice.call(form.querySelectorAll('input[name=cause]:checked')).map(function(c){ return c.value; });
      }
      run(api('PATCH', 'me', body).then(function(d){
        state.user = d.user; loadMemberOrgs();
        toast(d.verificationReset ? 'Saved. Because you changed your organization’s name, it will need to be verified again.' : 'Profile saved.');
        if(d.verificationReset) loadProfileExtras();
      }));
      return;
    }
    if(action==='change-password'){
      run(api('POST', 'me/password', { currentPassword:document.getElementById('pw-cur').value, newPassword:document.getElementById('pw-new').value })
        .then(function(){ form.reset(); toast('Password updated.'); }));
      return;
    }
    if(action==='delete-account'){
      if(!window.confirm('Permanently delete your account and everything you’ve posted? This can’t be undone.')) return;
      run(api('DELETE', 'me', { password:document.getElementById('del-pass').value }).then(function(){
        state.user=null; state.view='landing'; state.posts=[]; toast('Your account has been deleted.');
      }));
      return;
    }
  });

  document.addEventListener('keydown', function(e){
    if(e.key==='Escape' && state.modal){ state.modal=null; state.imageEdit=null; render(); }
  });

  /* ============ BOOT ============ */
  window.addEventListener('hashchange', handleHashLink);
  Promise.all([
    api('GET', 'config').catch(function(){ return {}; }),
    api('GET', 'me')
  ]).then(function(r){
    state.config = Object.assign(state.config, r[0]);
    state.booting = false;
    var wasGuest = false;
    try{ wasGuest = sessionStorage.getItem('gn_guest')==='1'; }catch(err){}
    if(r[1].user) enterApp(r[1].user); else if(wasGuest) enterGuest(); else render();
    handleHashLink();
  }, function(){ state.booting = false; render(); handleHashLink(); });
})();
</script>
